<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TRX WinGo Chart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a1a;color:#e0e0e0;font-family:'Segoe UI',sans-serif;overflow:hidden;touch-action:none;}
#header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:#12122a;border-bottom:1px solid #2a2a4a;height:48px;z-index:100;}
#header .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#header .title{font-size:15px;font-weight:700;color:#00e5ff;}
#cbox{display:flex;align-items:center;gap:6px;background:#1a1a3a;border:1px solid #00e5ff;border-radius:6px;padding:3px 10px;}
#cnum{font-size:20px;font-weight:700;color:#ffab00;min-width:28px;text-align:center;}
#cres{font-size:12px;font-weight:600;color:#aaa;max-width:220px;white-space:nowrap;}
#pid{font-size:10px;color:#666;margin-left:4px;}
#toolbar{display:flex;align-items:center;gap:4px;padding:4px 8px;background:#0e0e24;border-bottom:1px solid #222248;flex-wrap:wrap;z-index:99;}
#toolbar button{background:#1a1a3a;color:#ccc;border:1px solid #333;border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer;}
#toolbar button:hover{background:#2a2a5a;color:#fff;}
#toolbar button.active{background:#00e5ff;color:#000;border-color:#00e5ff;font-weight:700;}
#toolbar .sep{width:1px;height:22px;background:#333;margin:0 4px;}
#wrap{position:relative;width:100%;overflow:hidden;}
canvas{position:absolute;top:0;left:0;}
#cMain{z-index:1;}#cOver{z-index:2;}#cDraw{z-index:3;}#cCross{z-index:4;pointer-events:none;}#cAct{z-index:10;}
#rsiW{position:absolute;bottom:0;left:0;width:100%;border-top:1px solid #2a2a4a;}
#cRSI{z-index:1;}
#cmenu{position:absolute;display:none;background:#1a1a3a;border:1px solid #555;border-radius:6px;padding:4px 0;z-index:60;min-width:130px;box-shadow:0 4px 16px rgba(0,0,0,0.5);}
#cmenu div{padding:8px 16px;font-size:12px;cursor:pointer;color:#ddd;}
#cmenu div:hover{background:#2a2a5a;color:#fff;}
#histP{position:absolute;top:0;right:0;width:130px;height:100%;background:rgba(10,10,30,0.95);border-left:1px solid #2a2a4a;z-index:20;overflow-y:auto;padding:0;}
#histP .ht{font-size:10px;color:#888;text-align:center;padding:6px;border-bottom:1px solid #222;background:#0e0e24;}
.hr{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;font-size:11px;border-bottom:1px solid #151530;}
.hr.big{color:#00c853;}.hr.small{color:#ff1744;}
.hr .rn{font-weight:700;font-size:13px;}
#togH{position:absolute;top:4px;right:4px;z-index:25;background:#1a1a3a;color:#ccc;border:1px solid #333;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;}
@media(max-width:600px){
#header{padding:4px 8px;height:42px;}
#header .title{font-size:13px;}
#cnum{font-size:16px;}
#cres{font-size:10px;max-width:140px;}
#toolbar button{padding:3px 7px;font-size:11px;}
#histP{width:100px;}
}
</style>
</head>
<body>
<div id="header">
<div class="left">
<span class="title">TRX WinGo</span>
<div id="cbox"><span id="cnum">--</span><span id="cres">loading...</span></div>
<span id="pid"></span>
</div>
</div>
<div id="toolbar">
<button class="active" data-tool="pointer">☝Pointer</button><div class="sep"></div>
<button data-tool="trendline">📏Trend</button>
<button data-tool="hline">➖HLine</button>
<button data-tool="rect">⬜Rect</button>
<button data-tool="fib">📐Fib</button>
<button data-tool="text">🔤Text</button><div class="sep"></div>
<button data-ind="ema9">EMA9</button>
<button data-ind="ema21">EMA21</button>
<button data-ind="rsi">RSI</button><div class="sep"></div>
<button id="btnClear">🗑Clear</button>
</div>
<div id="wrap">
<canvas id="cMain"></canvas><canvas id="cOver"></canvas><canvas id="cDraw"></canvas>
<canvas id="cCross"></canvas><canvas id="cAct"></canvas>
<div id="rsiW"><canvas id="cRSI"></canvas></div>
<div id="cmenu"><div id="cmDel">🗑 Delete</div><div id="cmCol">🎨 Color</div></div>
<button id="togH">📊</button>
<div id="histP"><div class="ht">📋 History</div><div id="hList"></div></div>
</div>

<script>
const API='https://trx-apl.warwar-zc.workers.dev/';
const FIBLV=[0,0.236,0.382,0.5,0.618,0.786,1];
const COL={bg:'#0a0a1a',grid:'#1a1a3a',gt:'#555',up:'#00c853',dn:'#ff1744',e9:'#ffab00',e21:'#00b0ff',r1:'#e040fb',r2:'#00e5ff',cr:'rgba(255,255,255,0.2)',sel:'#00e5ff',tr:'#00e5ff',hl:'#ffab00',rf:'rgba(0,229,255,0.12)',rl:'#00e5ff',fb:'#e040fb',tx:'#fff'};
const PAW=50,BODY_H=2;

let W,H,mH,rH=100,hW=130;
let cv={},cc={};
let cds=[],e9=[],e21=[],rsi=[],rsig=[];
let cW=12,cG=4,sx=0;
let pN,pX,pR;
let ind={ema9:false,ema21:false,rsi:false};
let tool='pointer',draws=[],sel=null,dip=null;
let isDr=false,drg=null,pan=null,blk=false;
let mx=-1,my=-1,ltm=null,lfr=false;
let results=[],lastPeriod='',showH=true;
let priceZoom=1.0,priceDragActive=false,priceDragStartY=0,priceDragStartZoom=1.0,manualPriceZoom=false;

window.addEventListener('load',()=>{loadRes();szAll();setupTB();setupIn();loadDB();doFetch();setInterval(doFetch,5000);setInterval(tickCD,1000);tickCD();renderHistory();});
window.addEventListener('resize',()=>{szAll();renderAll();});

function szAll(){
  const wr=document.getElementById('wrap'),hdr=document.getElementById('header'),tb=document.getElementById('toolbar');
  W=window.innerWidth;H=window.innerHeight-hdr.offsetHeight-tb.offsetHeight;
  wr.style.height=H+'px';mH=H-(ind.rsi?rH:0);
  const cw=W-(showH?hW:0);
  ['Main','Over','Draw','Cross','Act'].forEach(n=>{const c=document.getElementById('c'+n);c.width=cw;c.height=H;c.style.width=cw+'px';c.style.height=H+'px';cv[n]=c;cc[n]=c.getContext('2d');});
  const rw=document.getElementById('rsiW');rw.style.height=(ind.rsi?rH:0)+'px';rw.style.top=mH+'px';rw.style.display=ind.rsi?'block':'none';rw.style.width=cw+'px';
  const rc=document.getElementById('cRSI');rc.width=cw;rc.height=rH;rc.style.width=cw+'px';rc.style.height=rH+'px';cv.RSI=rc;cc.RSI=rc.getContext('2d');
  document.getElementById('histP').style.display=showH?'block':'none';document.getElementById('histP').style.width=hW+'px';
  document.getElementById('togH').style.right=(showH?hW+4:4)+'px';
}
function tickCD(){const now=Math.floor(Date.now()/1000);let v=60-(now%60);if(v>=60)v=0;const el=document.getElementById('cnum');el.textContent=v+'s';el.style.color=v<=10?'#ff1744':'#ffab00';}

async function doFetch(){
  try{const r=await fetch(API);const data=await r.json();let rec=data.record||data.data?.record||data;if(!rec||!rec.period)return;
  const isBig=rec.bigSmall==='Big';document.getElementById('cres').textContent=(isBig?'🟢Big ':'🔴Small ')+rec.result;document.getElementById('cres').style.color=isBig?COL.up:COL.dn;document.getElementById('pid').textContent='#'+rec.period;
  if(rec.period!==lastPeriod){lastPeriod=rec.period;if(!results.find(x=>x.period===rec.period)){results.push({period:rec.period,result:rec.result,bigSmall:rec.bigSmall,timestamp:rec.timestamp||Date.now(),second:rec.second||0});if(results.length>500)results=results.slice(-500);saveRes();buildCandles();if(!blk&&!isDr&&!drg)scrollEnd();renderAll();renderHistory();}}}catch(e){}}

function buildCandles(){
  cds=[];if(!results.length)return;let price=50;
  for(const r of results){const isBig=r.bigSmall==='Big';let o=price,c2;if(isBig)c2=price+BODY_H;else c2=price-BODY_H;price=c2;
  const ts=r.timestamp>1e12?Math.floor(r.timestamp/1000):(r.timestamp||Math.floor(Date.now()/1000));
  cds.push({time:ts,open:o,high:Math.max(o,c2),low:Math.min(o,c2),close:c2,volume:r.result,period:r.period,result:r.result,bigSmall:r.bigSmall});}
  if(ind.ema9)calcEMA(9,e9);else e9=[];if(ind.ema21)calcEMA(21,e21);else e21=[];if(ind.rsi)calcRSI2(14);else{rsi=[];rsig=[];}
}
function scrollEnd(){const cw=CW();sx=Math.max(0,cds.length*(cW+cG)-cw+PAW+30);}
function renderHistory(){const list=document.getElementById('hList');let h='';const show=results.slice(-60).reverse();for(const r of show){const cls=r.bigSmall==='Big'?'big':'small';const ic=r.bigSmall==='Big'?'🟢':'🔴';h+=`<div class="hr ${cls}"><span>${r.period.slice(-4)}</span><span class="rn">${r.result}</span><span>${ic}${r.bigSmall}</span></div>`;}list.innerHTML=h;}
function saveRes(){try{localStorage.setItem('trx_r',JSON.stringify(results.slice(-500)));}catch(e){}}
function loadRes(){try{const d=localStorage.getItem('trx_r');if(d){results=JSON.parse(d);lastPeriod=results.length?results[results.length-1].period:'';buildCandles();}}catch(e){}}
function calcEMA(p,out){out.length=0;if(!cds.length)return;const k=2/(p+1);let v=cds[0].close;out.push(v);for(let i=1;i<cds.length;i++){v=cds[i].close*k+v*(1-k);out.push(v);}}
function calcRSI2(p){rsi.length=0;rsig.length=0;if(cds.length<p+1)return;let g=0,l=0;for(let i=1;i<=p;i++){const d=cds[i].close-cds[i-1].close;if(d>0)g+=d;else l-=d;}let ag=g/p,al=l/p;for(let i=0;i<p;i++)rsi.push(null);rsi.push(al===0?100:100-100/(1+ag/al));for(let i=p+1;i<cds.length;i++){const d=cds[i].close-cds[i-1].close;ag=(ag*(p-1)+(d>0?d:0))/p;al=(al*(p-1)+(d<0?-d:0))/p;rsi.push(al===0?100:100-100/(1+ag/al));}const sk=2/10;let se=0,ss=false;for(let i=0;i<rsi.length;i++){if(rsi[i]===null){rsig.push(null);continue;}if(!ss){se=rsi[i];ss=true;rsig.push(se);continue;}se=rsi[i]*sk+se*(1-sk);rsig.push(se);}}

function CW(){return cv.Main?cv.Main.width:W;}
function chW(){return CW()-PAW;}
function vr(){const cw=chW();const s=Math.floor(sx/(cW+cG)),e=Math.min(cds.length-1,s+Math.ceil(cw/(cW+cG))+2);return{s:Math.max(0,s),e};}
function cp(){const{s,e}=vr();if(s>e||!cds.length){pN=0;pX=1;pR=1;return;}let mn=1e18,mx2=-1e18;for(let i=s;i<=e;i++){if(cds[i].low<mn)mn=cds[i].low;if(cds[i].high>mx2)mx2=cds[i].high;}if(ind.ema9&&e9.length)for(let i=s;i<=e;i++){if(e9[i]!=null){if(e9[i]<mn)mn=e9[i];if(e9[i]>mx2)mx2=e9[i];}}if(ind.ema21&&e21.length)for(let i=s;i<=e;i++){if(e21[i]!=null){if(e21[i]<mn)mn=e21[i];if(e21[i]>mx2)mx2=e21[i];}}const bp=(mx2-mn)*0.15||2;const mid=(mx2+mn)/2;const hr=((mx2-mn)/2+bp)*priceZoom;pN=mid-hr;pX=mid+hr;pR=pX-pN;}
function p2y(p){return mH-((p-pN)/pR)*(mH-40)-20;}
function y2p(y){return pN+((mH-y-20)/(mH-40))*pR;}
function i2x(i){return i*(cW+cG)-sx+cG;}
function x2i(x){return(x+sx-cG)/(cW+cG);}
function r2y(v){return rH-((v)/100)*(rH-14)-7;}
function inPA(x){return x>=chW();}

function renderAll(){if(!cds.length)return;cp();rM();rO();rD();rR();}

function rM(){
  const cw=CW(),ch=chW(),c=cc.Main;c.clearRect(0,0,cw,H);c.fillStyle=COL.bg;c.fillRect(0,0,cw,H);
  c.fillStyle='#0e0e20';c.fillRect(ch,0,PAW,mH);c.strokeStyle='#2a2a4a';c.lineWidth=1;c.beginPath();c.moveTo(ch,0);c.lineTo(ch,mH);c.stroke();
  c.fillStyle=COL.gt;c.font='10px monospace';c.strokeStyle=COL.grid;c.lineWidth=0.5;
  const nl=8,st=pR/nl;for(let i=0;i<=nl;i++){const p=pN+st*i,y=p2y(p);if(y<5||y>mH-5)continue;c.setLineDash([2,4]);c.beginPath();c.moveTo(0,y);c.lineTo(ch,y);c.stroke();c.setLineDash([]);c.fillStyle=COL.gt;c.fillText(p.toFixed(1),ch+4,y+4);}
  const{s,e}=vr();const vs=Math.max(1,Math.floor((e-s)/6));
  for(let i=s;i<=e;i+=vs){const x=i2x(i)+cW/2;if(x<0||x>ch)continue;c.setLineDash([2,4]);c.beginPath();c.moveTo(x,0);c.lineTo(x,mH);c.stroke();c.setLineDash([]);if(cds[i]){const d=new Date(cds[i].time*1000);c.fillStyle=COL.gt;c.fillText(d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'),x-14,mH-4);}}
  c.strokeStyle='#2a2a4a';c.lineWidth=1;c.setLineDash([]);c.beginPath();c.moveTo(0,mH);c.lineTo(cw,mH);c.stroke();
  c.save();c.beginPath();c.rect(0,0,ch,mH);c.clip();
  for(let i=s;i<=e;i++){const d=cds[i],x=i2x(i),ib=d.bigSmall==='Big',col=ib?COL.up:COL.dn;const top=p2y(Math.max(d.open,d.close)),bot=p2y(Math.min(d.open,d.close)),bh=Math.max(1,bot-top);c.fillStyle=col;c.fillRect(x,top,cW,bh);c.strokeStyle=ib?'#00e676':'#ff5252';c.lineWidth=0.5;c.strokeRect(x,top,cW,bh);if(cW>=8){c.fillStyle='#fff';c.font='bold '+(cW>=14?'11':'9')+'px monospace';c.textAlign='center';c.fillText(d.result,x+cW/2,top-4);c.textAlign='left';}}
  c.restore();
  if(manualPriceZoom){c.fillStyle='rgba(0,229,255,0.1)';c.fillRect(ch,0,PAW,mH);c.fillStyle='#00e5ff';c.font='9px sans-serif';c.fillText('×'+priceZoom.toFixed(2),ch+4,14);}
}
function rO(){
  const cw=CW(),ch=chW(),c=cc.Over;c.clearRect(0,0,cw,H);const{s,e}=vr();
  c.save();c.beginPath();c.rect(0,0,ch,mH);c.clip();
  if(ind.ema9&&e9.length){c.strokeStyle=COL.e9;c.lineWidth=1.5;c.beginPath();let st=0;for(let i=s;i<=e;i++){if(e9[i]==null)continue;const x=i2x(i)+cW/2,y=p2y(e9[i]);st?c.lineTo(x,y):(c.moveTo(x,y),st=1);}c.stroke();}
  if(ind.ema21&&e21.length){c.strokeStyle=COL.e21;c.lineWidth=1.5;c.beginPath();let st=0;for(let i=s;i<=e;i++){if(e21[i]==null)continue;const x=i2x(i)+cW/2,y=p2y(e21[i]);st?c.lineTo(x,y):(c.moveTo(x,y),st=1);}c.stroke();}
  c.restore();
  if(cds.length){const la=cds[cds.length-1],y=p2y(la.close),up=la.bigSmall==='Big';c.save();c.beginPath();c.rect(0,0,ch,mH);c.clip();c.strokeStyle=up?COL.up:COL.dn;c.lineWidth=1;c.setLineDash([4,4]);c.beginPath();c.moveTo(0,y);c.lineTo(ch,y);c.stroke();c.setLineDash([]);c.restore();c.fillStyle=up?COL.up:COL.dn;c.fillRect(ch,y-10,PAW,20);c.fillStyle='#000';c.font='bold 10px monospace';c.fillText(la.close.toFixed(1),ch+4,y+4);}
}
function rR(){const cw=CW(),c=cc.RSI;c.clearRect(0,0,cw,rH);if(!ind.rsi||!rsi.length)return;c.fillStyle=COL.bg;c.fillRect(0,0,cw,rH);const ob=r2y(70),os=r2y(30);c.fillStyle='rgba(255,23,68,0.15)';c.fillRect(0,0,cw,ob);c.fillStyle='rgba(0,200,83,0.15)';c.fillRect(0,os,cw,rH-os);c.strokeStyle='#333';c.lineWidth=0.5;[30,50,70].forEach(v=>{c.setLineDash([3,3]);c.beginPath();c.moveTo(0,r2y(v));c.lineTo(cw,r2y(v));c.stroke();});c.setLineDash([]);const{s,e}=vr();c.strokeStyle=COL.r1;c.lineWidth=1.5;c.beginPath();let st=0;for(let i=s;i<=e;i++){if(rsi[i]==null)continue;const x=i2x(i)+cW/2,y=r2y(rsi[i]);st?c.lineTo(x,y):(c.moveTo(x,y),st=1);}c.stroke();c.strokeStyle=COL.r2;c.lineWidth=1;c.beginPath();st=0;for(let i=s;i<=e;i++){if(rsig[i]==null)continue;const x=i2x(i)+cW/2,y=r2y(rsig[i]);st?c.lineTo(x,y):(c.moveTo(x,y),st=1);}c.stroke();c.fillStyle='#666';c.font='9px monospace';c.fillText('70',2,ob+10);c.fillText('30',2,os-3);c.fillText('RSI',cw-28,12);}

function rD(){const c=cc.Draw;c.clearRect(0,0,CW(),H);c.save();c.beginPath();c.rect(0,0,chW(),mH);c.clip();draws.forEach(d=>d1(c,d,sel&&sel.id===d.id));if(dip)d1(c,dip,false);c.restore();}
function d1(c,d,s){switch(d.type){case'trendline':dTr(c,d,s);break;case'hline':dHL(c,d,s);break;case'rect':dRc(c,d,s);break;case'fib':dFb(c,d,s);break;case'text':dTx(c,d,s);break;}}
function dTr(c,d,s){const x1=i2x(d.x1)+cW/2,y1=p2y(d.y1),x2=i2x(d.x2)+cW/2,y2=p2y(d.y2);c.strokeStyle=d.color||COL.tr;c.lineWidth=s?2.5:1.5;c.setLineDash(s?[6,3]:[]);c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.setLineDash([]);if(s){eP(c,x1,y1);eP(c,x2,y2);}}
function dHL(c,d,s){const ch=chW(),y=p2y(d.y1);c.strokeStyle=d.color||COL.hl;c.lineWidth=s?2:1;c.setLineDash([6,4]);c.beginPath();c.moveTo(0,y);c.lineTo(ch,y);c.stroke();c.setLineDash([]);c.fillStyle=d.color||COL.hl;c.font='10px monospace';c.fillText(d.y1.toFixed(1),5,y-4);if(s)eP(c,ch/2,y);}
function dRc(c,d,s){const x1=i2x(d.x1)+cW/2,y1=p2y(d.y1),x2=i2x(d.x2)+cW/2,y2=p2y(d.y2);const rx=Math.min(x1,x2),ry=Math.min(y1,y2),rw=Math.abs(x2-x1),rh2=Math.abs(y2-y1);c.fillStyle=d.fill||COL.rf;c.fillRect(rx,ry,rw,rh2);c.strokeStyle=d.color||COL.rl;c.lineWidth=s?2:1;c.setLineDash(s?[4,3]:[]);c.strokeRect(rx,ry,rw,rh2);c.setLineDash([]);if(s){eP(c,x1,y1);eP(c,x2,y2);eP(c,x1,y2);eP(c,x2,y1);}}
function dFb(c,d,s){const x1=i2x(d.x1)+cW/2,x2=i2x(d.x2)+cW/2;const hi=Math.max(d.y1,d.y2),lo=Math.min(d.y1,d.y2),rng=hi-lo;const cols=['#ff1744','#ff6d00','#ffab00','#fff','#00e5ff','#00c853','#e040fb'];FIBLV.forEach((lv,i)=>{const p=hi-rng*lv,y=p2y(p);c.strokeStyle=cols[i];c.lineWidth=s?1.5:1;c.setLineDash(lv===0||lv===1?[]:[4,3]);c.beginPath();c.moveTo(Math.min(x1,x2)-20,y);c.lineTo(Math.max(x1,x2)+20,y);c.stroke();c.setLineDash([]);c.fillStyle=cols[i];c.font='10px monospace';c.fillText((lv*100).toFixed(1)+'%',Math.min(x1,x2)-20,y-3);});if(s){eP(c,x1,p2y(d.y1));eP(c,x2,p2y(d.y2));}}
function dTx(c,d,s){const x=i2x(d.x1)+cW/2,y=p2y(d.y1);c.fillStyle=d.color||COL.tx;c.font='bold 13px sans-serif';const t=d.text||'Text';c.fillText(t,x,y);if(s){const m=c.measureText(t);c.strokeStyle=COL.sel;c.lineWidth=1;c.setLineDash([3,3]);c.strokeRect(x-3,y-14,m.width+6,18);c.setLineDash([]);}}
function eP(c,x,y){c.fillStyle=COL.sel;c.strokeStyle='#fff';c.lineWidth=1.5;c.beginPath();c.arc(x,y,6,0,Math.PI*2);c.fill();c.stroke();}
function rCr(x,y){const cw=CW(),ch=chW(),c=cc.Cross;c.clearRect(0,0,cw,H);if(x<0||y<0||x>ch)return;c.strokeStyle=COL.cr;c.lineWidth=0.5;c.setLineDash([4,4]);c.beginPath();c.moveTo(x,0);c.lineTo(x,mH);c.moveTo(0,y);c.lineTo(ch,y);c.stroke();c.setLineDash([]);if(y<mH){const p=y2p(y);c.fillStyle='#1a1a3a';c.fillRect(ch,y-10,PAW,20);c.strokeStyle='#555';c.strokeRect(ch,y-10,PAW,20);c.fillStyle='#ddd';c.font='10px monospace';c.fillText(p.toFixed(1),ch+4,y+4);}const idx=Math.round(x2i(x));if(idx>=0&&idx<cds.length){const d=new Date(cds[idx].time*1000);const ts=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');c.fillStyle='#1a1a3a';c.fillRect(x-20,mH-16,40,16);c.fillStyle='#ddd';c.font='10px monospace';c.fillText(ts,x-14,mH-4);const r=cds[idx];if(r){const ib=r.bigSmall==='Big';const info=`#${(r.period||'').slice(-4)} ${ib?'🟢':'🔴'}${r.result} ${r.bigSmall}`;const tw2=c.measureText(info).width+12;c.fillStyle='rgba(10,10,30,0.92)';c.fillRect(x+12,y-28,tw2,22);c.strokeStyle='#00e5ff';c.lineWidth=0.5;c.strokeRect(x+12,y-28,tw2,22);c.fillStyle='#fff';c.font='11px monospace';c.fillText(info,x+18,y-12);}}}

// ===== TOOLBAR =====
function setupTB(){
  document.querySelectorAll('#toolbar button[data-tool]').forEach(b=>{b.addEventListener('click',()=>{tool=b.dataset.tool;document.querySelectorAll('#toolbar button[data-tool]').forEach(bb=>bb.classList.remove('active'));b.classList.add('active');canDr();desel();uCur();});});
  document.querySelectorAll('#toolbar button[data-ind]').forEach(b=>{b.addEventListener('click',()=>{const k=b.dataset.ind;ind[k]=!ind[k];b.classList.toggle('active',ind[k]);buildCandles();if(k==='rsi'){mH=H-(ind.rsi?rH:0);const rw=document.getElementById('rsiW');rw.style.height=(ind.rsi?rH:0)+'px';rw.style.top=mH+'px';rw.style.display=ind.rsi?'block':'none';cv.RSI.height=rH;cv.RSI.style.height=rH+'px';}renderAll();});});
  document.getElementById('btnClear').addEventListener('click',()=>{draws=[];sel=null;saveDB();renderAll();});
  document.getElementById('cmDel').addEventListener('click',()=>{if(sel){draws=draws.filter(d=>d.id!==sel.id);sel=null;saveDB();renderAll();}hideCM();});
  document.getElementById('cmCol').addEventListener('click',()=>{if(sel){const cs=['#00e5ff','#ffab00','#ff1744','#00c853','#e040fb','#fff','#ff6d00'];sel.color=cs[(cs.indexOf(sel.color)+1)%cs.length];saveDB();renderAll();}hideCM();});
  document.getElementById('togH').addEventListener('click',()=>{showH=!showH;szAll();renderAll();renderHistory();});
}
function uCur(){cv.Act.style.cursor=tool==='pointer'?'default':'crosshair';}

// ★ FIX: Auto switch back to pointer after drawing
function backToPointer(){
  tool='pointer';
  document.querySelectorAll('#toolbar button[data-tool]').forEach(b=>b.classList.remove('active'));
  document.querySelector('[data-tool="pointer"]').classList.add('active');
  uCur();
}

// ===== INPUT =====
function setupIn(){
  const el=cv.Act;
  el.addEventListener('mousedown',e=>{e.preventDefault();hDown(e.offsetX,e.offsetY);});
  el.addEventListener('mousemove',e=>{hMove(e.offsetX,e.offsetY);});
  el.addEventListener('mouseup',e=>{hUp(e.offsetX,e.offsetY);});
  el.addEventListener('mouseleave',()=>{mx=-1;my=-1;rCr(-1,-1);priceDragActive=false;});
  el.addEventListener('dblclick',e=>{hDbl(e.offsetX,e.offsetY);});
  el.addEventListener('wheel',e=>{e.preventDefault();e.deltaY<0?zI():zO();},{passive:false});
  el.addEventListener('contextmenu',e=>e.preventDefault());
  let tsx2=0,tsy2=0,pD2=0,tch=false;
  el.addEventListener('touchstart',e=>{e.preventDefault();if(e.touches.length===2){pD2=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);return;}const t=e.touches[0],r=el.getBoundingClientRect(),tx=t.clientX-r.left,ty=t.clientY-r.top;tch=true;tsx2=tx;tsy2=ty;lfr=false;ltm=setTimeout(()=>{lfr=true;hDbl(tx,ty);},500);hDown(tx,ty);},{passive:false});
  el.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===2){const nd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(nd/pD2>1.04){zI();pD2=nd;}else if(nd/pD2<0.96){zO();pD2=nd;}return;}clearTimeout(ltm);const t=e.touches[0],r=el.getBoundingClientRect();hMove(t.clientX-r.left,t.clientY-r.top);},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();clearTimeout(ltm);if(tch&&!lfr){const r=el.getBoundingClientRect();let tx=tsx2,ty=tsy2;if(e.changedTouches.length){tx=e.changedTouches[0].clientX-r.left;ty=e.changedTouches[0].clientY-r.top;}hUp(tx,ty);}tch=false;mx=-1;my=-1;rCr(-1,-1);priceDragActive=false;},{passive:false});
  document.addEventListener('keydown',e=>{if((e.key==='Delete'||e.key==='Backspace')&&sel){draws=draws.filter(d=>d.id!==sel.id);sel=null;saveDB();renderAll();}if(e.key==='Escape'){canDr();desel();backToPointer();}});
  document.addEventListener('click',e=>{if(!e.target.closest('#cmenu'))hideCM();});
}

function hDown(x,y){
  mx=x;my=y;hideCM();

  // Price axis drag
  if(inPA(x)&&y<mH){priceDragActive=true;priceDragStartY=y;priceDragStartZoom=priceZoom;manualPriceZoom=true;cv.Act.style.cursor='ns-resize';return;}
  uCur();

  // Selected drawing: endpoint or move
  if(sel&&tool==='pointer'){
    const ep=fEP(sel,x,y);if(ep!==null){drg={type:'ep',id:sel.id,idx:ep,sx:x,sy:y};blk=true;return;}
    if(hT(sel,x,y)){drg={type:'mv',id:sel.id,sx:x,sy:y,ox1:sel.x1,oy1:sel.y1,ox2:sel.x2,oy2:sel.y2};blk=true;return;}
    // ★ Click empty area → deselect
    sel=null;renderAll();
  }

  // ★ Drawing tools: 1-click types auto switch back
  if(tool!=='pointer'){
    blk=true;const idx=x2i(x),pr=y2p(y);
    if(tool==='text'){
      const t=prompt('Enter text:','Label');
      if(t){draws.push({id:gid(),type:'text',x1:idx,y1:pr,text:t,color:COL.tx});saveDB();renderAll();}
      blk=false;
      backToPointer(); // ★ FIX
      return;
    }
    if(tool==='hline'){
      draws.push({id:gid(),type:'hline',y1:pr,color:COL.hl});saveDB();renderAll();
      blk=false;
      backToPointer(); // ★ FIX
      return;
    }
    // 2-point tools start
    if(!dip){dip={id:gid(),type:tool,x1:idx,y1:pr,x2:idx,y2:pr,color:tool==='trendline'?COL.tr:tool==='rect'?COL.rl:COL.fb,fill:tool==='rect'?COL.rf:undefined};isDr=true;}
    return;
  }

  // Pan
  pan={sx:x,sy:y,ss:sx};
}

function hMove(x,y){
  mx=x;my=y;
  if(inPA(x)&&y<mH&&!priceDragActive&&!drg&&!isDr&&!pan)cv.Act.style.cursor='ns-resize';else if(!priceDragActive&&!drg)uCur();
  if(priceDragActive){const dy=y-priceDragStartY;priceZoom=Math.max(0.1,Math.min(5,priceDragStartZoom+dy*0.005));renderAll();return;}
  rCr(x,y);
  if(drg&&drg.type==='ep'){const d=draws.find(dd=>dd.id===drg.id);if(!d)return;const idx=x2i(x),pr=y2p(y);if(d.type==='trendline'||d.type==='fib'){drg.idx===0?(d.x1=idx,d.y1=pr):(d.x2=idx,d.y2=pr);}else if(d.type==='rect'){[()=>{d.x1=idx;d.y1=pr;},()=>{d.x2=idx;d.y2=pr;},()=>{d.x1=idx;d.y2=pr;},()=>{d.x2=idx;d.y1=pr;}][drg.idx]();}else if(d.type==='hline'){d.y1=pr;}sel=d;renderAll();return;}
  if(drg&&drg.type==='mv'){const d=draws.find(dd=>dd.id===drg.id);if(!d)return;const di=(x-drg.sx)/(cW+cG),dp=-(y-drg.sy)/(mH-40)*pR;if(d.type==='trendline'||d.type==='rect'||d.type==='fib'){d.x1=drg.ox1+di;d.y1=drg.oy1+dp;d.x2=drg.ox2+di;d.y2=drg.oy2+dp;}else if(d.type==='hline'){d.y1=drg.oy1+dp;}else if(d.type==='text'){d.x1=drg.ox1+di;d.y1=drg.oy1+dp;}sel=d;renderAll();return;}
  if(isDr&&dip){dip.x2=x2i(x);dip.y2=y2p(y);renderAll();return;}
  if(pan&&tool==='pointer'){sx=Math.max(0,pan.ss+(pan.sx-x));sx=Math.min(sx,Math.max(0,cds.length*(cW+cG)-chW()+30));renderAll();}
}

// ★ FIX: 2-point drawing finish → auto back to pointer
function hUp(x,y){
  mx=x;my=y;
  if(priceDragActive){priceDragActive=false;uCur();return;}
  if(drg){drg=null;blk=false;saveDB();renderAll();return;}
  if(isDr&&dip){
    dip.x2=x2i(x);dip.y2=y2p(y);
    const dx2=Math.abs(i2x(dip.x2)-i2x(dip.x1)),dy2=Math.abs(p2y(dip.y2)-p2y(dip.y1));
    if(dx2>3||dy2>3){draws.push({...dip});saveDB();}
    dip=null;isDr=false;blk=false;
    backToPointer(); // ★ FIX: auto switch to pointer
    renderAll();return;
  }
  pan=null;
}

function hDbl(x,y){
  if(inPA(x)&&y<mH){priceZoom=1.0;manualPriceZoom=false;renderAll();return;}
  desel();hideCM();
  for(let i=draws.length-1;i>=0;i--){if(hT(draws[i],x,y)){sel=draws[i];renderAll();showCM(x,y);return;}}
  desel();renderAll();
}

function zI(){if(cW<40){cW=Math.min(40,cW+2);cG=Math.max(1,Math.round(cW*0.3));adjS();renderAll();}}
function zO(){if(cW>2){cW=Math.max(2,cW-2);cG=Math.max(1,Math.round(cW*0.3));adjS();renderAll();}}
function adjS(){sx=Math.min(sx,Math.max(0,cds.length*(cW+cG)-chW()+30));}

function hT(d,x,y){switch(d.type){case'trendline':return dSg(x,y,i2x(d.x1)+cW/2,p2y(d.y1),i2x(d.x2)+cW/2,p2y(d.y2))<10;case'hline':return Math.abs(y-p2y(d.y1))<8;case'rect':const x1=i2x(d.x1)+cW/2,y1=p2y(d.y1),x2=i2x(d.x2)+cW/2,y2=p2y(d.y2);return x>=Math.min(x1,x2)-8&&x<=Math.max(x1,x2)+8&&y>=Math.min(y1,y2)-8&&y<=Math.max(y1,y2)+8;case'fib':const hi=Math.max(d.y1,d.y2),lo=Math.min(d.y1,d.y2),rng=hi-lo;for(const lv of FIBLV){if(Math.abs(y-p2y(hi-rng*lv))<8)return true;}return false;case'text':const tx2=i2x(d.x1)+cW/2,ty2=p2y(d.y1);return x>=tx2-5&&x<=tx2+100&&y>=ty2-16&&y<=ty2+6;}return false;}
function fEP(d,px,py){const R=12;if(d.type==='trendline'||d.type==='fib'){if(Math.hypot(px-i2x(d.x1)-cW/2,py-p2y(d.y1))<R)return 0;if(Math.hypot(px-i2x(d.x2)-cW/2,py-p2y(d.y2))<R)return 1;}else if(d.type==='rect'){const x1=i2x(d.x1)+cW/2,y1=p2y(d.y1),x2=i2x(d.x2)+cW/2,y2=p2y(d.y2);if(Math.hypot(px-x1,py-y1)<R)return 0;if(Math.hypot(px-x2,py-y2)<R)return 1;if(Math.hypot(px-x1,py-y2)<R)return 2;if(Math.hypot(px-x2,py-y1)<R)return 3;}else if(d.type==='hline'){if(Math.abs(py-p2y(d.y1))<R)return 0;}return null;}
function dSg(px,py,x1,y1,x2,y2){const A=px-x1,B=py-y1,C2=x2-x1,D=y2-y1,dot=A*C2+B*D,l2=C2*C2+D*D;let t=l2?dot/l2:-1;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(x1+t*C2),py-(y1+t*D));}

function canDr(){dip=null;isDr=false;blk=false;renderAll();}
function desel(){sel=null;renderAll();}
function showCM(x,y){const c=document.getElementById('cmenu');c.style.display='block';c.style.left=Math.min(x,CW()-140)+'px';c.style.top=Math.min(y,H-80)+'px';}
function hideCM(){document.getElementById('cmenu').style.display='none';}
function gid(){return'd_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);}
function oDB(){return new Promise((ok,no)=>{const r=indexedDB.open('TRXDraw3',1);r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('d'))db.createObjectStore('d',{keyPath:'id'});};r.onsuccess=e=>ok(e.target.result);r.onerror=e=>no(e);});}
async function saveDB(){try{const db=await oDB();const tx=db.transaction('d','readwrite');const st=tx.objectStore('d');st.clear();draws.forEach(d=>st.put(JSON.parse(JSON.stringify(d))));}catch(e){}}
async function loadDB(){try{const db=await oDB();const tx=db.transaction('d','readonly');const st=tx.objectStore('d');const r=st.getAll();r.onsuccess=()=>{draws=r.result||[];renderAll();};}catch(e){}}
</script>
