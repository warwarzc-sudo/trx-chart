<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TRX WinGo Chart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a1a;color:#e0e0e0;font-family:'Segoe UI',sans-serif;overflow:hidden;touch-action:none;}
#authScreen{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#0a0a1a,#1a1a3a);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;}
#authBox{background:#12122a;border:2px solid #00e5ff;border-radius:16px;padding:30px;max-width:500px;width:100%;box-shadow:0 8px 40px rgba(0,229,255,0.2);}
#authBox h1{color:#00e5ff;margin-bottom:8px;font-size:24px;text-align:center;}
#authBox .subtitle{color:#888;text-align:center;margin-bottom:25px;font-size:13px;}
#authBox .step{margin-bottom:20px;padding:15px;background:#1a1a3a;border-radius:8px;border-left:3px solid #00e5ff;}
#authBox .step-title{color:#00e5ff;font-weight:700;margin-bottom:8px;font-size:13px;}
#authBox input{width:100%;padding:12px;background:#0a0a1a;border:1px solid #444;border-radius:6px;color:#fff;font-size:14px;margin-bottom:10px;}
#authBox input:focus{border-color:#00e5ff;outline:none;}
#authBox button{width:100%;padding:14px;background:linear-gradient(90deg,#00e5ff,#00b8cc);color:#000;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;margin-top:10px;}
#authBox button:hover{opacity:0.9;}
#authBox button:disabled{background:#444;color:#888;cursor:not-allowed;}
#authStatus{padding:12px;border-radius:6px;margin-top:15px;font-size:13px;text-align:center;}
#authStatus.pending{background:rgba(255,171,0,0.15);color:#ffab00;border:1px solid #ffab00;}
#authStatus.rejected{background:rgba(255,82,82,0.15);color:#ff5252;border:1px solid #ff5252;}
#authStatus.expired{background:rgba(255,82,82,0.15);color:#ff5252;border:1px solid #ff5252;}
#authStatus.error{background:rgba(255,82,82,0.15);color:#ff5252;border:1px solid #ff5252;}
.deviceIdBox{background:#0a0a1a;padding:12px;border-radius:6px;border:1px dashed #00e5ff;margin:10px 0;font-family:monospace;font-size:12px;color:#00e5ff;word-break:break-all;}
.copy-btn{background:#1a1a3a !important;color:#00e5ff !important;border:1px solid #00e5ff !important;padding:6px 12px !important;font-size:11px !important;width:auto !important;margin-top:5px !important;}
#header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:#12122a;border-bottom:1px solid #2a2a4a;height:48px;z-index:100;}
#header .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#header .title{font-size:15px;font-weight:700;color:#00e5ff;}
#cbox{display:flex;align-items:center;gap:6px;background:#1a1a3a;border:1px solid #00e5ff;border-radius:6px;padding:3px 10px;}
#cnum{font-size:20px;font-weight:700;color:#ffab00;min-width:28px;text-align:center;}
#cres{font-size:12px;font-weight:600;max-width:220px;white-space:nowrap;color:#888;}
#toolbar{display:flex;align-items:center;gap:4px;padding:4px 8px;background:#0e0e24;border-bottom:1px solid #222248;flex-wrap:wrap;z-index:99;}
#toolbar button{background:#1a1a3a;color:#ccc;border:1px solid #333;border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer;}
#toolbar button:hover{background:#2a2a5a;color:#fff;}
#toolbar button.active{background:#00e5ff;color:#000;border-color:#00e5ff;font-weight:700;}
#betPanel{position:absolute;left:0;width:100%;background:#0d0d22;border-top:2px solid #ffab00;z-index:25;display:none;flex-direction:column;}
#betPanel.show{display:flex;}
#betDrag{position:absolute;left:0;top:-6px;width:100%;height:12px;cursor:ns-resize;z-index:31;background:rgba(255,171,0,0.2);border-top:1px solid rgba(255,171,0,0.4);border-bottom:1px solid rgba(255,171,0,0.4);transition:background 0.2s;display:flex;align-items:center;justify-content:center;}
#betDrag:hover,#betDrag.active{background:rgba(255,171,0,0.5);}
#betContent{flex:1;display:flex;padding:10px;gap:10px;overflow:hidden;}
.betSection{background:#1a1a3a;border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px;}
.betSection h4{color:#ffab00;font-size:11px;text-transform:uppercase;font-weight:700;letter-spacing:1px;border-bottom:1px solid #2a2a4a;padding-bottom:4px;margin-bottom:2px;}
#betQuick{flex:0 0 220px;}
#betStats{flex:0 0 240px;}
#betHistory{flex:1;overflow-y:auto;min-width:200px;}
#betChoice{display:flex;gap:6px;}
#betChoice button{flex:1;padding:10px;border:none;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer;transition:all 0.2s;}
.btnBig{background:#1a3a1a;color:#00e676;border:2px solid #00e676 !important;}
.btnBig.selected{background:#00e676;color:#000;}
.btnSmall{background:#3a1a1a;color:#ff5252;border:2px solid #ff5252 !important;}
.btnSmall.selected{background:#ff5252;color:#fff;}
#betAmount{width:100%;padding:8px;background:#0a0a1a;border:1px solid #444;border-radius:4px;color:#fff;font-size:14px;font-weight:700;text-align:center;}
#betPresets{display:flex;gap:4px;flex-wrap:wrap;}
#betPresets button{flex:1;padding:6px;background:#0a0a1a;border:1px solid #444;border-radius:4px;color:#aaa;font-size:11px;cursor:pointer;min-width:50px;}
#betPresets button:hover{background:#2a2a5a;color:#fff;border-color:#666;}
#betPlace{padding:10px;background:linear-gradient(90deg,#ffab00,#ff8800);color:#000;border:none;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer;}
.statRow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #2a2a4a;font-size:12px;}
.statLabel{color:#aaa;}
.statValue{font-weight:700;color:#fff;}
.statValue.win{color:#00e676;}
.statValue.loss{color:#ff5252;}
.statValue.profit{font-size:14px;}
#winRateChart{background:#1a1a3a;border-radius:6px;}
</style>

<body>

</div>

</div>

<div id="toolbar">

<div id="betPanel">
  <div id="betDrag"></div>
  <div id="betContent">
    <div class="betSection" id="betQuick">
      <h4>Quick Bet</h4>
      <div id="betChoice">
        <button class="btnBig" id="chooseBig">BIG</button>

        <button data-amt="100">100</button>

      <div class="statRow"><span class="statLabel">Win Rate</span><span class="statValue" id="sRate">0%</span></div>
      <div class="statRow"><span class="statLabel">Net Profit</span><span class="statValue profit" id="sProfit">0</span></div>

<script>
const dbgEl=document.getElementById('dbgBox');
const dbgLines=[];
function D(msg){const t=new Date().toLocaleTimeString();const line='['+t+'] '+msg;dbgLines.push(line);if(dbgLines.length>100)dbgLines.shift();dbgEl.innerHTML=dbgLines.map(l=>'<div>'+l+'</div>').join('');dbgEl.scrollTop=dbgEl.scrollHeight;console.log(line);}

// AUTH PART
const AUTH_API='https://trx-auth.warwar-zc.workers.dev';
function getDeviceId(){let id=localStorage.getItem('trx_device_id');if(!id){const nav=navigator;const screen=window.screen;const fp=[nav.userAgent,nav.language,nav.platform,screen.width+'x'+screen.height,screen.colorDepth,new Date().getTimezoneOffset(),Math.random().toString(36).substr(2,9)].join('|');let hash=0;for(let i=0;i<fp.length;i++){hash=((hash<<5)-hash)+fp.charCodeAt(i);hash=hash&hash;}id='dev_'+Math.abs(hash).toString(36)+'_'+Date.now().toString(36);localStorage.setItem('trx_device_id',id);}return id;}
// (keep all your original auth functions as is)

// YOUR ORIGINAL FULL CODE (kept intact)
const API='https://trx-apl.warwar-zc.workers.dev/';
const GAME_URL='https://6win598.com/?pwa=1&fb_dynamic_pixel=0&invitationCode=S25R373749#/';
const FIBLV=[0,0.236,0.382,0.5,0.618,0.786,1];
const COL={bg:'#0a0a1a',grid:'#252548',gtP:'#e0e0e0',gtT:'#d0d0d0',up:'#00e676',dn:'#ff5252',upB:'#00ff88',dnB:'#ff7575',cNum:'#ffeb3b',e9:'#ffab00',e21:'#29b6f6',r1:'#ff4081',r2:'#00e5ff',cr:'rgba(255,255,255,0.35)',sel:'#00e5ff',tr:'#00e5ff',hl:'#ffab00',rf:'rgba(0,229,255,0.15)',rl:'#00e5ff',fb:'#e040fb',tx:'#ffeb3b',rsiBg:'#0d0d22',rsiLine70:'#ff5252',rsiLine30:'#00e676',rsiLine50:'#ffab00',rsiTextOB:'#ff7575',rsiTextOS:'#00ff88',rsiText50:'#ffab00'};
const PAW=55,BODY_H=2;
const STORE_KEY='TRX_HIST_V3',DRAW_KEY='TRX_DRAW_V3',SIDE_KEY='TRX_SIDE_V3',TAB_KEY='TRX_TAB_V3',IND_KEY='TRX_IND_V3',RSI_H_KEY='TRX_RSIH_V3';
const BETS_KEY='TRX_BETS_V1',BET_PANEL_KEY='TRX_BETPANEL_V1',BET_H_KEY='TRX_BETH_V1';

let W,H,mH,rH=120,sideW=350,betH=180;
let cv={},cc={};
let cds=[],e9=[],e21=[],rsi=[],rsig=[];
let cW=8,cG=2,sx=0,pN,pX,pR;
let ind={ema9:0,ema21:0,rsi:0};
let tool='pointer',draws=[],sel=null,dip=null;
let isDr=false,drg=null,pan=null,blk=false;
let mx=-1,my=-1,ltm=null,lfr=false;
let results=[],lastPeriod='';
let sideShow=true,activeTab='hist',gameLoaded=false;
let priceZoom=1,pzAct=false,pzSY=0,pzSZ=1,pzMan=false;
let rsiDrg=false,rsiDSY=0,rsiDSH=0;
let isLoading=false,cancelLoading=false;
let currentBlockHeight=null,userZoomed=false;
let sideResizing=false,sideResizeStartX=0,sideResizeStartW=0;
let gameWindow=null;

let bets=[];
let betShow=false;
let selectedChoice=null;
let betDrg=false,betDSY=0,betDSH=0;

// (All your original functions like initApp, szAll, renderAll, buildCandles, doFetch, renderBets, etc. remain the same)

// ==================== 24H WIN RATE GRAPH ====================
function renderWinRateChart() {
  const canvas = document.getElementById('winRateChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const todayStart = new Date();
  todayStart.setHours(0,0,0,0);
  const todayBets = bets.filter(b => b.timestamp >= todayStart.getTime() && b.status !== 'pending');

  if (todayBets.length < 2) {
    ctx.fillStyle = '#666';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Not enough data yet', canvas.width/2, 70);
    return;
  }

  const hourly = {};
  todayBets.forEach(b => {
    const hour = new Date(b.timestamp).getHours();
    if (!hourly[hour]) hourly[hour] = {win:0, loss:0, total:0};
    hourly[hour].total++;
    if (b.status === 'win') hourly[hour].win++;
    else hourly[hour].loss++;
  });

  const hours = Object.keys(hourly).map(Number).sort((a,b)=>a-b);
  const maxCount = Math.max(...hours.map(h => hourly[h].total), 1);
  const barWidth = Math.max(8, Math.floor(230 / hours.length));
  const startX = 35;

  ctx.strokeStyle = '#333';
  for(let i = 0; i <= 5; i++) {
    const y = 20 + i * 18;
    ctx.beginPath();
    ctx.moveTo(30, y);
    ctx.lineTo(270, y);
    ctx.stroke();
  }

  hours.forEach((hour, i) => {
    const x = startX + i * (barWidth + 4);
    const data = hourly[hour];
    const height = Math.floor((data.total / maxCount) * 75);
    const winHeight = data.total > 0 ? Math.floor((data.win / data.total) * height) : 0;

    ctx.fillStyle = '#00e676';
    ctx.fillRect(x, 95 - winHeight, barWidth, winHeight);

    ctx.fillStyle = '#ff5252';
    ctx.fillRect(x, 95, barWidth, height - winHeight);
  });

  ctx.fillStyle = '#aaa';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('24H Win Rate Trend', canvas.width/2, 15);
}

// Update renderBets
const originalRenderBets = renderBets || function(){};
function renderBets(){
  originalRenderBets();
  renderWinRateChart();
}

// Keep your original initApp, etc.
</script>
