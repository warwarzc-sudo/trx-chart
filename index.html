<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TRX WinGo Chart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a1a;color:#e0e0e0;font-family:'Segoe UI',sans-serif;overflow:hidden;touch-action:none;}
#header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:#12122a;border-bottom:1px solid #2a2a4a;height:48px;z-index:100;}
#header .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#header .title{font-size:15px;font-weight:700;color:#00e5ff;}
#cbox{display:flex;align-items:center;gap:6px;background:#1a1a3a;border:1px solid #00e5ff;border-radius:6px;padding:3px 10px;}
#cnum{font-size:20px;font-weight:700;color:#ffab00;min-width:28px;text-align:center;}
#cres{font-size:12px;font-weight:600;max-width:220px;white-space:nowrap;color:#888;}
#pid{font-size:10px;color:#aaa;margin-left:4px;}
#toolbar{display:flex;align-items:center;gap:4px;padding:4px 8px;background:#0e0e24;border-bottom:1px solid #222248;flex-wrap:wrap;z-index:99;}
#toolbar button{background:#1a1a3a;color:#ccc;border:1px solid #333;border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer;}
#toolbar button:hover{background:#2a2a5a;color:#fff;}
#toolbar button.active{background:#00e5ff;color:#000;border-color:#00e5ff;font-weight:700;}
#toolbar .sep{width:1px;height:22px;background:#333;margin:0 4px;}
#btnLoad{background:#1a3a1a !important;color:#0f0 !important;border-color:#0f0 !important;}
#btnLoad:hover{background:#2a5a2a !important;}
#btnLoad.loading{background:#3a3a1a !important;color:#ff0 !important;border-color:#ff0 !important;cursor:wait;}
#btnReset{background:#3a1a1a !important;color:#f55 !important;border-color:#f55 !important;}
#btnFit{background:#1a2a3a !important;color:#0bf !important;border-color:#0bf !important;}
#wrap{position:relative;width:100%;overflow:hidden;}
canvas{position:absolute;top:0;left:0;}
#cMain{z-index:1;}#cOver{z-index:2;}#cDraw{z-index:3;}#cCross{z-index:4;pointer-events:none;}#cAct{z-index:10;}
#rsiW{position:absolute;bottom:0;left:0;width:100%;}
#rsiDrag{position:absolute;left:0;width:100%;height:8px;cursor:ns-resize;z-index:30;background:transparent;}
#rsiDrag:hover{background:rgba(0,229,255,0.4);}
#cRSI{z-index:1;}
#cmenu{position:absolute;display:none;background:#1e1e3a;border:1px solid #00e5ff;border-radius:6px;padding:4px 0;z-index:60;min-width:140px;}
#cmenu div{padding:8px 16px;font-size:12px;cursor:pointer;color:#eee;}
#cmenu div:hover{background:#2a2a5a;}
#histP{position:absolute;top:0;right:0;width:130px;height:100%;background:rgba(8,8,25,0.97);border-left:1px solid #2a2a4a;z-index:20;overflow-y:auto;}
#histP .ht{font-size:11px;color:#00e5ff;text-align:center;padding:6px;border-bottom:1px solid #222;background:#0e0e24;font-weight:700;position:sticky;top:0;z-index:1;}
.hr{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;font-size:11px;border-bottom:1px solid #151530;}
.hr.big{color:#00e676;}.hr.small{color:#ff5252;}
.hr .rn{font-weight:700;font-size:14px;}
#togH{position:absolute;top:4px;right:4px;z-index:25;background:#1a1a3a;color:#ccc;border:1px solid #444;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;}
#dbgBox{position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,0.95);color:#0f0;font-family:monospace;font-size:11px;padding:6px 10px;z-index:9999;max-height:30vh;overflow-y:auto;border-top:1px solid #0f0;}
#dbgBox.hide{display:none;}
#dbgToggle{position:fixed;bottom:4px;right:4px;z-index:10000;background:#1a1a3a;color:#0f0;border:1px solid #0f0;border-radius:4px;padding:2px 8px;font-size:10px;cursor:pointer;}
#loadOverlay{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,10,30,0.95);border:2px solid #00e5ff;border-radius:8px;padding:20px 30px;z-index:5000;color:#fff;font-size:14px;display:none;text-align:center;box-shadow:0 4px 20px rgba(0,229,255,0.3);min-width:300px;}
#loadOverlay.show{display:block;}
#loadProg{margin-top:10px;background:#222;border-radius:4px;height:8px;overflow:hidden;}
#loadProgBar{background:linear-gradient(90deg,#00e5ff,#00e676);height:100%;width:0%;transition:width 0.3s;}
#cancelBtn{margin-top:12px;background:#3a1a1a;color:#f55;border:1px solid #f55;border-radius:4px;padding:6px 14px;font-size:12px;cursor:pointer;}
#cancelBtn:hover{background:#5a2a2a;}
@media(max-width:600px){
#header{padding:4px 8px;height:42px;}
#header .title{font-size:13px;}
#cnum{font-size:16px;}
#cres{font-size:10px;max-width:140px;}
#toolbar button{padding:3px 7px;font-size:11px;}
#histP{width:100px;}
}
</style>
</head>
<body>
<div id="header">
<div class="left">
<span class="title">TRX WinGo</span>
<div id="cbox"><span id="cnum">--</span><span id="cres">loading...</span></div>
<span id="pid"></span>
</div>
</div>
<div id="toolbar">
<button class="active" data-tool="pointer">☝Pointer</button><div class="sep"></div>
<button data-tool="trendline">📏Trend</button>
<button data-tool="hline">➖HLine</button>
<button data-tool="rect">⬜Rect</button>
<button data-tool="fib">📐Fib</button>
<button data-tool="text">🔤Text</button><div class="sep"></div>
<button data-ind="ema9">EMA9</button>
<button data-ind="ema21">EMA21</button>
<button data-ind="rsi">RSI</button><div class="sep"></div>
<button id="btnLoad">⬇️ Load History</button>
<button id="btnFit">📐 Fit</button>
<button id="btnClear">🗑Clear</button>
<button id="btnReset">⚠️Reset All</button>
</div>
<div id="wrap">
<canvas id="cMain"></canvas><canvas id="cOver"></canvas><canvas id="cDraw"></canvas>
<canvas id="cCross"></canvas><canvas id="cAct"></canvas>
<div id="rsiDrag"></div>
<div id="rsiW"><canvas id="cRSI"></canvas></div>
<div id="cmenu"><div id="cmDel">🗑 Delete</div><div id="cmCol">🎨 Color</div></div>
<button id="togH">📊</button>
<div id="histP"><div class="ht">📋 History (<span id="hCount">0</span>)</div><div id="hList"></div></div>
</div>
<div id="loadOverlay">
  <div id="loadMsg">Loading...</div>
  <div id="loadProg"><div id="loadProgBar"></div></div>
  <button id="cancelBtn" onclick="cancelLoading=true">❌ Cancel</button>
</div>
<div id="dbgBox" class="hide"></div>
<button id="dbgToggle">🔧Debug</button>

<script>
const dbgEl=document.getElementById('dbgBox');
const dbgLines=[];
function D(msg){const t=new Date().toLocaleTimeString();const line='['+t+'] '+msg;dbgLines.push(line);if(dbgLines.length>100)dbgLines.shift();dbgEl.innerHTML=dbgLines.map(l=>'<div>'+l+'</div>').join('');dbgEl.scrollTop=dbgEl.scrollHeight;console.log(line);}
document.getElementById('dbgToggle').addEventListener('click',()=>{dbgEl.classList.toggle('hide');});

const API='https://trx-apl.warwar-zc.workers.dev/';
const FIBLV=[0,0.236,0.382,0.5,0.618,0.786,1];

// ========== UPDATED COLOR PALETTE ==========
// Brighter text colors for better contrast against dark background
const COL={
  bg:'#0a0a1a',
  grid:'#252548',          // brighter grid
  gtP:'#e0e0e0',           // price labels - bright white
  gtT:'#d0d0d0',           // time labels - bright
  up:'#00e676',
  dn:'#ff5252',
  upB:'#00ff88',
  dnB:'#ff7575',
  cNum:'#ffeb3b',          // candle number - vivid yellow
  e9:'#ffab00',
  e21:'#29b6f6',           // brighter blue
  r1:'#ff4081',            // RSI line - bright pink
  r2:'#00e5ff',            // RSI signal - bright cyan
  cr:'rgba(255,255,255,0.35)',
  sel:'#00e5ff',
  tr:'#00e5ff',
  hl:'#ffab00',
  rf:'rgba(0,229,255,0.15)',
  rl:'#00e5ff',
  fb:'#e040fb',
  tx:'#ffeb3b',
  // RSI specific
  rsiBg:'#0d0d22',
  rsiLine70:'#ff5252',     // overbought line
  rsiLine30:'#00e676',     // oversold line
  rsiLine50:'#888',        // mid line
  rsiTextOB:'#ff7575',
  rsiTextOS:'#00ff88',
  rsiText50:'#aaa'
};
const PAW=55,BODY_H=2;
const STORE_KEY='TRX_HIST_V3';
const DRAW_KEY='TRX_DRAW_V3';

let W,H,mH,rH=120,hW=130;
let cv={},cc={};
let cds=[],e9=[],e21=[],rsi=[],rsig=[];
let cW=8,cG=2,sx=0,pN,pX,pR;
let ind={ema9:0,ema21:0,rsi:0};
let tool='pointer',draws=[],sel=null,dip=null;
let isDr=false,drg=null,pan=null,blk=false;
let mx=-1,my=-1,ltm=null,lfr=false;
let results=[],lastPeriod='',showH=true;
let priceZoom=1,pzAct=false,pzSY=0,pzSZ=1,pzMan=false;
let rsiDrg=false,rsiDSY=0,rsiDSH=0;
let isLoading=false;
let cancelLoading=false;
let currentBlockHeight=null;
let userZoomed=false;

function storeSave(){try{const j=JSON.stringify(results);localStorage.setItem(STORE_KEY,j);D('💾 SAVED: '+results.length+' records');}catch(e){D('❌ SAVE: '+e.message);try{results=results.slice(-2000);localStorage.setItem(STORE_KEY,JSON.stringify(results));}catch(e2){}}}
function storeLoad(){try{const r=localStorage.getItem(STORE_KEY);if(!r){D('📂 No saved data');return[];}const a=JSON.parse(r);if(!Array.isArray(a))return[];D('✅ LOADED: '+a.length+' records');return a;}catch(e){D('❌ LOAD: '+e.message);return[];}}
function drawSave(){try{localStorage.setItem(DRAW_KEY,JSON.stringify(draws));}catch(e){}}
function drawLoad(){try{const r=localStorage.getItem(DRAW_KEY);if(r){const a=JSON.parse(r);if(Array.isArray(a))return a;}}catch(e){}return[];}

function showOverlay(msg,prog){
  const el=document.getElementById('loadOverlay');
  document.getElementById('loadMsg').innerHTML=msg;
  if(prog!==undefined)document.getElementById('loadProgBar').style.width=prog+'%';
  el.classList.add('show');
}
function hideOverlay(){document.getElementById('loadOverlay').classList.remove('show');}

function mergeResults(newRecords){
  const map=new Map();
  for(const r of results)map.set(r.period,r);
  let added=0;
  for(const r of newRecords){
    if(!map.has(r.period)){
      map.set(r.period,r);
      added++;
    }
  }
  results=Array.from(map.values()).sort((a,b)=>{
    const ta=a.timestamp>1e12?a.timestamp:a.timestamp*1000;
    const tb=b.timestamp>1e12?b.timestamp:b.timestamp*1000;
    return ta-tb;
  });
  if(results.length>0)lastPeriod=results[results.length-1].period;
  return added;
}

function autoFitCandles(){
  if(!cds.length)return;
  const visW=chW();
  const targetVisible=Math.min(cds.length, 150);
  let idealW=Math.floor((visW-PAW-30) / (targetVisible*1.3));
  
  if(cds.length>800){
    cW=Math.max(2,Math.min(5,idealW));
  }else if(cds.length>400){
    cW=Math.max(3,Math.min(7,idealW));
  }else if(cds.length>200){
    cW=Math.max(5,Math.min(10,idealW));
  }else if(cds.length>50){
    cW=Math.max(8,Math.min(15,idealW));
  }else{
    cW=Math.max(15,Math.min(25,idealW));
  }
  cG=Math.max(1,Math.round(cW*0.3));
  D('📐 Auto-fit: '+cds.length+' candles, cW='+cW+', cG='+cG);
}

async function loadBulkHistory(totalHours){
  if(isLoading)return;
  isLoading=true;
  cancelLoading=false;
  const btn=document.getElementById('btnLoad');
  btn.classList.add('loading');

  D('📥 Bulk loading '+totalHours+' hours via block range...');

  showOverlay('Fetching current block...',2);
  let currentBlock=null;
  try{
    const ctrl=new AbortController();
    const timeoutId=setTimeout(()=>ctrl.abort(),15000);
    const r=await fetch(API+'?mode=info',{signal:ctrl.signal});
    clearTimeout(timeoutId);
    const data=await r.json();
    currentBlock=data.currentBlock;
    currentBlockHeight=currentBlock;
    D('Current block: '+currentBlock);
  }catch(e){
    D('❌ Failed to get current block: '+e.message);
    showOverlay('❌ Failed to get current block<br><small>'+e.message+'</small>');
    setTimeout(hideOverlay,3000);
    isLoading=false;
    btn.classList.remove('loading');
    btn.textContent='⬇️ Load History';
    return;
  }

  if(!currentBlock){
    isLoading=false;
    btn.classList.remove('loading');
    btn.textContent='⬇️ Load History';
    hideOverlay();
    return;
  }

  const blocksPerChunk=800;
  const totalBlocks=totalHours*1200;
  const totalChunks=Math.ceil(totalBlocks/blocksPerChunk);
  const oldestBlock=currentBlock-totalBlocks;

  let totalAdded=0;
  let totalLoaded=0;
  let consecutiveFails=0;

  D('Strategy: '+totalChunks+' chunks of '+blocksPerChunk+' blocks');

  for(let i=0;i<totalChunks;i++){
    if(cancelLoading){
      D('⛔ User cancelled');
      break;
    }
    const chunkEnd=currentBlock-(i*blocksPerChunk);
    const chunkStart=Math.max(oldestBlock,chunkEnd-blocksPerChunk);
    const prog=Math.round((i/totalChunks)*100);
    btn.textContent='⏳ '+(i+1)+'/'+totalChunks;

    showOverlay('Loading chunk '+(i+1)+' of '+totalChunks+
      '<br><small>Block '+chunkStart+' → '+chunkEnd+
      '<br>Total: '+results.length+' records | New: +'+totalAdded+'</small>',prog);

    try{
      const ctrl=new AbortController();
      const timeoutId=setTimeout(()=>ctrl.abort(),30000);
      const r=await fetch(API+'?mode=blocks&from='+chunkStart+'&to='+chunkEnd,{signal:ctrl.signal});
      clearTimeout(timeoutId);
      const data=await r.json();
      if(data.records&&Array.isArray(data.records)&&data.records.length>0){
        const added=mergeResults(data.records);
        totalAdded+=added;
        totalLoaded+=data.records.length;
        D('  Chunk '+(i+1)+': fetched '+data.records.length+', added '+added+
          ' (success '+(data.successes||'?')+'/'+(data.attempts||'?')+')');
        consecutiveFails=0;

        storeSave();
        buildCandles();
        if(!userZoomed)autoFitCandles();
        renderAll();
        renderHistory();
      }else{
        consecutiveFails++;
        D('  Chunk '+(i+1)+': no records');
        if(consecutiveFails>=3){
          D('⚠️ 3 consecutive empty - stopping');
          break;
        }
      }
      await new Promise(r=>setTimeout(r,1000));
    }catch(e){
      D('❌ Chunk '+(i+1)+' error: '+e.message);
      consecutiveFails++;
      if(consecutiveFails>=3)break;
    }
  }

  storeSave();
  buildCandles();
  if(!userZoomed)autoFitCandles();
  scrollEnd();
  renderAll();
  renderHistory();

  showOverlay('✅ Done!<br><small>Fetched '+totalLoaded+' | Added '+totalAdded+' new<br>'+
    'Total: '+results.length+' records<br>'+
    'Coverage: ~'+Math.round(results.length/60)+' hours</small>',100);
  setTimeout(hideOverlay,4000);
  D('✅ Bulk done: '+totalAdded+' new added, total: '+results.length);

  isLoading=false;
  cancelLoading=false;
  btn.classList.remove('loading');
  btn.textContent='⬇️ Load History';
}

function showLoadMenu(){
  const choice=prompt(
    '📥 Load History - choose hours:\n\n'+
    '1  = 1 hour (~60 records)\n'+
    '3  = 3 hours (~180 records)\n'+
    '6  = 6 hours (~360 records)\n'+
    '12 = 12 hours (~720 records)\n'+
    '24 = 1 day (~1440 records)\n\n'+
    'Enter number:','3');
  if(!choice)return;
  const hours=parseInt(choice);
  if(hours&&hours>0&&hours<=48){
    loadBulkHistory(hours);
  }else{
    alert('Invalid: please enter 1-48');
  }
}

window.addEventListener('load',()=>{
  D('🚀 App starting...');
  const saved=storeLoad();
  if(saved.length>0){
    results=saved;
    lastPeriod=results[results.length-1].period;
  }
  draws=drawLoad();
  buildCandles();
  szAll();setupTB();setupIn();setupRD();
  autoFitCandles();
  scrollEnd();renderAll();renderHistory();

  setInterval(tickCD,1000);
  tickCD();

  doFetch();
  setInterval(doFetch,5000);

  D('💡 Click "Load History" to fetch past data');
});
window.addEventListener('resize',()=>{szAll();if(!userZoomed)autoFitCandles();renderAll();});

function szAll(){
  const wr=document.getElementById('wrap'),hdr=document.getElementById('header'),tb=document.getElementById('toolbar');
  W=window.innerWidth;H=window.innerHeight-hdr.offsetHeight-tb.offsetHeight;
  wr.style.height=H+'px';mH=H-(ind.rsi?rH:0);
  const cw=W-(showH?hW:0);
  ['Main','Over','Draw','Cross','Act'].forEach(n=>{const c=document.getElementById('c'+n);c.width=cw;c.height=H;c.style.width=cw+'px';c.style.height=H+'px';cv[n]=c;cc[n]=c.getContext('2d');});
  const rw=document.getElementById('rsiW');rw.style.height=(ind.rsi?rH:0)+'px';rw.style.top=mH+'px';rw.style.display=ind.rsi?'block':'none';rw.style.width=cw+'px';
  const rd=document.getElementById('rsiDrag');rd.style.top=(mH-4)+'px';rd.style.width=cw+'px';rd.style.display=ind.rsi?'block':'none';
  const rc=document.getElementById('cRSI');rc.width=cw;rc.height=rH;rc.style.width=cw+'px';rc.style.height=rH+'px';cv.RSI=rc;cc.RSI=rc.getContext('2d');
  document.getElementById('histP').style.display=showH?'block':'none';document.getElementById('histP').style.width=hW+'px';
  document.getElementById('togH').style.right=(showH?hW+4:4)+'px';
}

function setupRD(){
  const rd=document.getElementById('rsiDrag');
  const s=y=>{rsiDrg=true;rsiDSY=y;rsiDSH=rH;};
  const m=y=>{if(!rsiDrg)return;rH=Math.max(40,Math.min(H-80,rsiDSH+(rsiDSY-y)));szAll();renderAll();};
  const e2=()=>{rsiDrg=false;};
  rd.addEventListener('mousedown',ev=>{ev.preventDefault();s(ev.clientY);});
  document.addEventListener('mousemove',ev=>{m(ev.clientY);});
  document.addEventListener('mouseup',e2);
  rd.addEventListener('touchstart',ev=>{ev.preventDefault();s(ev.touches[0].clientY);},{passive:false});
  document.addEventListener('touchmove',ev=>{if(rsiDrg)m(ev.touches[0].clientY);});
  document.addEventListener('touchend',e2);
}

function tickCD(){
  const now=Math.floor(Date.now()/1000);
  let v=60-(now%60);if(v>=60)v=0;
  const el=document.getElementById('cnum');
  el.textContent=v+'s';
  el.style.color=v<=10?'#ff1744':'#ffab00';
}

async function doFetch(){
  if(isLoading)return;
  try{
    const ctrl=new AbortController();
    const timeoutId=setTimeout(()=>ctrl.abort(),8000);
    const r=await fetch(API,{signal:ctrl.signal});
    clearTimeout(timeoutId);
    const data=await r.json();
    let rec=data.record||(data.data&&data.data.record)||data;
    if(!rec||!rec.period)return;
    const isBig=rec.bigSmall==='Big';
    document.getElementById('cres').textContent=(isBig?'🟢 Big ':'🔴 Small ')+rec.result;
    document.getElementById('cres').style.color=isBig?COL.up:COL.dn;
    document.getElementById('pid').textContent='#'+rec.period;
    if(rec.period===lastPeriod)return;
    if(results.some(x=>x.period===rec.period)){lastPeriod=rec.period;return;}
    D('🆕 '+rec.period+' '+rec.bigSmall+' '+rec.result);
    lastPeriod=rec.period;
    results.push({period:rec.period,result:rec.result,bigSmall:rec.bigSmall,timestamp:rec.timestamp||Date.now(),second:rec.second||0});
    results.sort((a,b)=>{const ta=a.timestamp>1e12?a.timestamp:a.timestamp*1000;const tb=b.timestamp>1e12?b.timestamp:b.timestamp*1000;return ta-tb;});
    storeSave();
    buildCandles();
    if(!blk&&!isDr&&!drg)scrollEnd();
    renderAll();renderHistory();
  }catch(e){D('❌ Fetch: '+e.message);}
}

function buildCandles(){
  cds=[];if(!results.length)return;
  let price=50;
  for(const r of results){
    const ib=r.bigSmall==='Big';
    const o=price,c2=ib?price+BODY_H:price-BODY_H;
    price=c2;
    const ts=r.timestamp>1e12?Math.floor(r.timestamp/1000):(r.timestamp||Math.floor(Date.now()/1000));
    cds.push({time:ts,open:o,high:Math.max(o,c2),low:Math.min(o,c2),close:c2,result:r.result,period:r.period,bigSmall:r.bigSmall});
  }
  if(ind.ema9)calcEMA(9,e9);else e9=[];
  if(ind.ema21)calcEMA(21,e21);else e21=[];
  if(ind.rsi)calcRSI2(14);else{rsi=[];rsig=[];}
}

function scrollEnd(){
  if(!cds.length){sx=0;return;}
  const totalW=cds.length*(cW+cG);
  const visW=chW();
  if(totalW<visW-PAW){
    sx=-((visW-PAW-totalW)/2);
  }else{
    sx=Math.max(0,totalW-visW+PAW+30);
  }
}

function renderHistory(){
  document.getElementById('hCount').textContent=results.length;
  const list=document.getElementById('hList');let h='';
  const show=results.slice(-200).reverse();
  for(const r of show){
    const cls=r.bigSmall==='Big'?'big':'small';
    const ic=r.bigSmall==='Big'?'🟢':'🔴';
    const t=new Date(r.timestamp>1e12?r.timestamp:r.timestamp*1000);
    const ts=t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');
    h+=`<div class="hr ${cls}"><span style="color:#aaa;font-size:9px">${ts}</span><span class="rn">${r.result}</span><span>${ic}${r.bigSmall}</span></div>`;
  }
  list.innerHTML=h;
}

function calcEMA(p,out){out.length=0;if(!cds.length)return;const k=2/(p+1);let v=cds[0].close;out.push(v);for(let i=1;i<cds.length;i++){v=cds[i].close*k+v*(1-k);out.push(v);}}
function calcRSI2(p){rsi.length=0;rsig.length=0;if(cds.length<p+1)return;let g=0,l=0;for(let i=1;i<=p;i++){const d=cds[i].close-cds[i-1].close;if(d>0)g+=d;else l-=d;}let ag=g/p,al=l/p;for(let i=0;i<p;i++)rsi.push(null);rsi.push(al===0?100:100-100/(1+ag/al));for(let i=p+1;i<cds.length;i++){const d=cds[i].close-cds[i-1].close;ag=(ag*(p-1)+(d>0?d:0))/p;al=(al*(p-1)+(d<0?-d:0))/p;rsi.push(al===0?100:100-100/(1+ag/al));}const sk=2/10;let se=0,ss=false;for(let i=0;i<rsi.length;i++){if(rsi[i]===null){rsig.push(null);continue;}if(!ss){se=rsi[i];ss=true;rsig.push(se);continue;}se=rsi[i]*sk+se*(1-sk);rsig.push(se);}}

function CW(){return cv.Main?cv.Main.width:W;}
function chW(){return CW()-PAW;}
function vr(){const cw=chW(),s=Math.floor(sx/(cW+cG)),e=Math.min(cds.length-1,s+Math.ceil(cw/(cW+cG))+2);return{s:Math.max(0,s),e};}
function cp(){if(!cds.length){pN=0;pX=1;pR=1;return;}let s,e;if(cds.length*(cW+cG)<chW()){s=0;e=cds.length-1;}else{const r=vr();s=r.s;e=r.e;}let mn=1e18,mx2=-1e18;for(let i=s;i<=e;i++){if(cds[i].low<mn)mn=cds[i].low;if(cds[i].high>mx2)mx2=cds[i].high;}if(ind.ema9&&e9.length)for(let i=s;i<=e;i++){if(e9[i]!=null){if(e9[i]<mn)mn=e9[i];if(e9[i]>mx2)mx2=e9[i];}}if(ind.ema21&&e21.length)for(let i=s;i<=e;i++){if(e21[i]!=null){if(e21[i]<mn)mn=e21[i];if(e21[i]>mx2)mx2=e21[i];}}const bp=(mx2-mn)*0.2||3;const mid=(mx2+mn)/2,hr=((mx2-mn)/2+bp)*priceZoom;pN=mid-hr;pX=mid+hr;pR=pX-pN;}
function p2y(p){return mH-((p-pN)/pR)*(mH-40)-20;}
function y2p(y){return pN+((mH-y-20)/(mH-40))*pR;}
function i2x(i){return i*(cW+cG)-sx+cG;}
function x2i(x){return(x+sx-cG)/(cW+cG);}
function r2y(v){return rH-(v/100)*(rH-14)-7;}
function inPA(x){return x>=chW();}

function renderAll(){if(!cds.length){clearAll();return;}cp();rM();rO();rD();rR();}

function clearAll(){['Main','Over','Draw','Cross','RSI'].forEach(n=>{if(cc[n]){const c=cc[n],cv2=cv[n];c.clearRect(0,0,cv2.width,cv2.height);c.fillStyle=COL.bg;c.fillRect(0,0,cv2.width,cv2.height);}});if(cc.Main){cc.Main.fillStyle='#ddd';cc.Main.font='16px sans-serif';cc.Main.textAlign='center';cc.Main.fillText('Click "Load History" button to fetch past data',CW()/2,H/2);cc.Main.font='12px sans-serif';cc.Main.fillStyle='#999';cc.Main.fillText('(Or wait for new results to appear automatically)',CW()/2,H/2+24);cc.Main.textAlign='left';}}

function rM(){
  const cw=CW(),ch=chW(),c=cc.Main;c.clearRect(0,0,cw,H);c.fillStyle=COL.bg;c.fillRect(0,0,cw,H);
  // Price axis background - slightly darker than main
  c.fillStyle='#13132d';c.fillRect(ch,0,PAW,mH);
  c.strokeStyle='#444';c.lineWidth=1;c.beginPath();c.moveTo(ch,0);c.lineTo(ch,mH);c.stroke();
  // Grid
  c.strokeStyle=COL.grid;c.lineWidth=0.5;
  const nl=8,st=pR/nl;
  for(let i=0;i<=nl;i++){
    const p=pN+st*i,y=p2y(p);
    if(y<5||y>mH-5)continue;
    c.setLineDash([2,4]);c.beginPath();c.moveTo(0,y);c.lineTo(ch,y);c.stroke();c.setLineDash([]);
    // Price label - bright white with shadow
    c.fillStyle=COL.gtP;c.font='bold 11px monospace';
    c.fillText(p.toFixed(1),ch+4,y+4);
  }
  const{s,e}=vr();const vs=Math.max(1,Math.floor((e-s)/8));
  for(let i=s;i<=e;i+=vs){
    const x=i2x(i)+cW/2;
    if(x<0||x>ch)continue;
    c.setLineDash([2,4]);c.strokeStyle=COL.grid;
    c.beginPath();c.moveTo(x,0);c.lineTo(x,mH);c.stroke();c.setLineDash([]);
    if(cds[i]){
      const d=new Date(cds[i].time*1000);
      c.fillStyle=COL.gtT;c.font='bold 11px monospace';
      c.fillText(d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'),x-16,mH-4);
    }
  }
  c.strokeStyle='#444';c.lineWidth=1;c.setLineDash([]);
  c.beginPath();c.moveTo(0,mH);c.lineTo(cw,mH);c.stroke();
  c.save();c.beginPath();c.rect(0,0,ch,mH);c.clip();
  for(let i=s;i<=e;i++){
    const d=cds[i],x=i2x(i),ib=d.bigSmall==='Big',col=ib?COL.up:COL.dn;
    const top=p2y(Math.max(d.open,d.close)),bot=p2y(Math.min(d.open,d.close)),bh=Math.max(2,bot-top);
    c.fillStyle=col;c.fillRect(x,top,cW,bh);
    if(cW>=4){c.strokeStyle=ib?COL.upB:COL.dnB;c.lineWidth=0.5;c.strokeRect(x,top,cW,bh);}
    if(cW>=10){
      c.fillStyle=COL.cNum;c.font='bold '+(cW>=14?'12':'10')+'px monospace';c.textAlign='center';
      c.fillText(d.result,x+cW/2,top-5);
      c.textAlign='left';
    }
  }
  c.restore();
  if(pzMan){c.fillStyle='rgba(0,229,255,0.08)';c.fillRect(ch,0,PAW,mH);c.fillStyle='#00e5ff';c.font='bold 9px sans-serif';c.fillText('x'+priceZoom.toFixed(2),ch+4,14);}
  // Bottom info text - brighter
  c.fillStyle='#888';c.font='bold 10px monospace';
  c.fillText('Candles: '+cds.length+' | View: '+(e-s+1)+' | cW='+cW+'px',8,H-8);
}

function rO(){
  const cw=CW(),ch=chW(),c=cc.Over;c.clearRect(0,0,cw,H);const{s,e}=vr();
  c.save();c.beginPath();c.rect(0,0,ch,mH);c.clip();
  if(ind.ema9&&e9.length){c.strokeStyle=COL.e9;c.lineWidth=1.5;c.beginPath();let st=0;for(let i=s;i<=e;i++){if(e9[i]==null)continue;const x=i2x(i)+cW/2,y=p2y(e9[i]);st?c.lineTo(x,y):(c.moveTo(x,y),st=1);}c.stroke();}
  if(ind.ema21&&e21.length){c.strokeStyle=COL.e21;c.lineWidth=1.5;c.beginPath();let st=0;for(let i=s;i<=e;i++){if(e21[i]==null)continue;const x=i2x(i)+cW/2,y=p2y(e21[i]);st?c.lineTo(x,y):(c.moveTo(x,y),st=1);}c.stroke();}
  c.restore();
  if(cds.length){const la=cds[cds.length-1],y=p2y(la.close),up=la.bigSmall==='Big';c.save();c.beginPath();c.rect(0,0,ch,mH);c.clip();c.strokeStyle=up?COL.up:COL.dn;c.lineWidth=1;c.setLineDash([4,4]);c.beginPath();c.moveTo(0,y);c.lineTo(ch,y);c.stroke();c.setLineDash([]);c.restore();c.fillStyle=up?COL.up:COL.dn;c.fillRect(ch,y-10,PAW,20);c.fillStyle='#000';c.font='bold 11px monospace';c.fillText(la.close.toFixed(1),ch+4,y+4);}
}

// ===== UPDATED RSI - much brighter =====
function rR(){
  const cw=CW(),c=cc.RSI;
  c.clearRect(0,0,cw,rH);
  if(!ind.rsi||!rsi.length)return;
  
  // Background - slightly darker
  c.fillStyle=COL.rsiBg;c.fillRect(0,0,cw,rH);
  
  const ob=r2y(70),os=r2y(30),mid=r2y(50);
  
  // Overbought/oversold zones - more visible
  c.fillStyle='rgba(255,82,82,0.18)';c.fillRect(0,0,cw,ob);
  c.fillStyle='rgba(0,230,118,0.18)';c.fillRect(0,os,cw,rH-os);
  
  // 70 line - SOLID and BRIGHT
  c.strokeStyle=COL.rsiLine70;c.lineWidth=1.5;c.setLineDash([6,3]);
  c.beginPath();c.moveTo(0,ob);c.lineTo(cw,ob);c.stroke();
  
  // 30 line - SOLID and BRIGHT
  c.strokeStyle=COL.rsiLine30;c.lineWidth=1.5;c.setLineDash([6,3]);
  c.beginPath();c.moveTo(0,os);c.lineTo(cw,os);c.stroke();
  
  // 50 line - subtle
  c.strokeStyle=COL.rsiLine50;c.lineWidth=0.8;c.setLineDash([3,5]);
  c.beginPath();c.moveTo(0,mid);c.lineTo(cw,mid);c.stroke();
  c.setLineDash([]);
  
  const{s,e}=vr();
  
  // RSI line - thicker and brighter
  c.strokeStyle=COL.r1;c.lineWidth=2;
  c.beginPath();let st=0;
  for(let i=s;i<=e;i++){
    if(rsi[i]==null)continue;
    const x=i2x(i)+cW/2,y=r2y(rsi[i]);
    st?c.lineTo(x,y):(c.moveTo(x,y),st=1);
  }
  c.stroke();
  
  // Signal line
  c.strokeStyle=COL.r2;c.lineWidth=1.5;
  c.beginPath();st=0;
  for(let i=s;i<=e;i++){
    if(rsig[i]==null)continue;
    const x=i2x(i)+cW/2,y=r2y(rsig[i]);
    st?c.lineTo(x,y):(c.moveTo(x,y),st=1);
  }
  c.stroke();
  
  // Labels - VERY bright
  c.font='bold 11px monospace';
  
  // 70 label with background box
  c.fillStyle='rgba(0,0,0,0.6)';c.fillRect(0,ob-7,24,14);
  c.fillStyle=COL.rsiTextOB;
  c.fillText('70',3,ob+4);
  
  // 30 label with background box
  c.fillStyle='rgba(0,0,0,0.6)';c.fillRect(0,os-7,24,14);
  c.fillStyle=COL.rsiTextOS;
  c.fillText('30',3,os+4);
  
  // 50 label
  c.fillStyle='rgba(0,0,0,0.6)';c.fillRect(0,mid-7,24,14);
  c.fillStyle=COL.rsiText50;
  c.fillText('50',3,mid+4);
  
  // RSI title - top right
  c.fillStyle='rgba(0,0,0,0.7)';c.fillRect(cw-60,2,55,16);
  c.fillStyle='#00e5ff';c.font='bold 11px monospace';
  c.fillText('RSI',cw-55,14);
  
  // Current RSI value
  if(rsi.length){
    const lr=rsi[rsi.length-1];
    if(lr!=null){
      c.fillStyle='rgba(0,0,0,0.7)';c.fillRect(cw-60,18,55,16);
      c.fillStyle=lr>70?COL.dn:lr<30?COL.up:'#fff';
      c.font='bold 12px monospace';
      c.fillText(lr.toFixed(1),cw-55,30);
    }
  }
}

function rD(){const c=cc.Draw;c.clearRect(0,0,CW(),H);c.save();c.beginPath();c.rect(0,0,chW(),mH);c.clip();draws.forEach(d=>d1(c,d,sel&&sel.id===d.id));if(dip)d1(c,dip,false);c.restore();}
function d1(c,d,s){switch(d.type){case'trendline':dTr(c,d,s);break;case'hline':dHL(c,d,s);break;case'rect':dRc(c,d,s);break;case'fib':dFb(c,d,s);break;case'text':dTx(c,d,s);break;}}
function dTr(c,d,s){const x1=i2x(d.x1)+cW/2,y1=p2y(d.y1),x2=i2x(d.x2)+cW/2,y2=p2y(d.y2);c.strokeStyle=d.color||COL.tr;c.lineWidth=s?3:2;c.setLineDash(s?[6,3]:[]);c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.setLineDash([]);if(s){eP(c,x1,y1);eP(c,x2,y2);}}
function dHL(c,d,s){const ch=chW(),y=p2y(d.y1);c.strokeStyle=d.color||COL.hl;c.lineWidth=s?2.5:1.5;c.setLineDash([8,4]);c.beginPath();c.moveTo(0,y);c.lineTo(ch,y);c.stroke();c.setLineDash([]);c.fillStyle=d.color||COL.hl;c.font='bold 12px monospace';c.fillText(d.y1.toFixed(1),5,y-6);if(s)eP(c,ch/2,y);}
function dRc(c,d,s){const x1=i2x(d.x1)+cW/2,y1=p2y(d.y1),x2=i2x(d.x2)+cW/2,y2=p2y(d.y2);const rx=Math.min(x1,x2),ry=Math.min(y1,y2),rw=Math.abs(x2-x1),rh2=Math.abs(y2-y1);c.fillStyle=d.fill||COL.rf;c.fillRect(rx,ry,rw,rh2);c.strokeStyle=d.color||COL.rl;c.lineWidth=s?2.5:1.5;c.setLineDash(s?[4,3]:[]);c.strokeRect(rx,ry,rw,rh2);c.setLineDash([]);if(s){eP(c,x1,y1);eP(c,x2,y2);eP(c,x1,y2);eP(c,x2,y1);}}
function dFb(c,d,s){const x1=i2x(d.x1)+cW/2,x2=i2x(d.x2)+cW/2;const hi=Math.max(d.y1,d.y2),lo=Math.min(d.y1,d.y2),rng=hi-lo;const cols=['#ff5252','#ff9100','#ffea00','#fff','#00e5ff','#00e676','#e040fb'];FIBLV.forEach((lv,i)=>{const p=hi-rng*lv,y=p2y(p);c.strokeStyle=cols[i];c.lineWidth=s?2:1;c.setLineDash(lv===0||lv===1?[]:[4,3]);c.beginPath();c.moveTo(Math.min(x1,x2)-20,y);c.lineTo(Math.max(x1,x2)+20,y);c.stroke();c.setLineDash([]);c.fillStyle=cols[i];c.font='bold 11px monospace';c.fillText((lv*100).toFixed(1)+'%',Math.min(x1,x2)-20,y-4);});if(s){eP(c,x1,p2y(d.y1));eP(c,x2,p2y(d.y2));}}
function dTx(c,d,s){const x=i2x(d.x1)+cW/2,y=p2y(d.y1);c.fillStyle=d.color||COL.tx;c.font='bold 14px sans-serif';const t=d.text||'Text';c.fillText(t,x,y);if(s){const m=c.measureText(t);c.strokeStyle=COL.sel;c.lineWidth=1.5;c.setLineDash([3,3]);c.strokeRect(x-3,y-16,m.width+6,22);c.setLineDash([]);}}
function eP(c,x,y){c.fillStyle=COL.sel;c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.arc(x,y,7,0,Math.PI*2);c.fill();c.stroke();}

function rCr(x,y){const cw=CW(),ch=chW(),c=cc.Cross;c.clearRect(0,0,cw,H);if(x<0||y<0||x>ch)return;c.strokeStyle=COL.cr;c.lineWidth=0.5;c.setLineDash([4,4]);c.beginPath();c.moveTo(x,0);c.lineTo(x,mH);c.moveTo(0,y);c.lineTo(ch,y);c.stroke();c.setLineDash([]);if(y<mH){const p=y2p(y);c.fillStyle='#1e1e3a';c.fillRect(ch,y-10,PAW,20);c.strokeStyle='#666';c.strokeRect(ch,y-10,PAW,20);c.fillStyle='#fff';c.font='bold 11px monospace';c.fillText(p.toFixed(1),ch+4,y+4);}const idx=Math.round(x2i(x));if(idx>=0&&idx<cds.length){const d=new Date(cds[idx].time*1000);const ts=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');c.fillStyle='#1e1e3a';c.fillRect(x-22,mH-18,44,18);c.strokeStyle='#666';c.strokeRect(x-22,mH-18,44,18);c.fillStyle='#fff';c.font='bold 11px monospace';c.fillText(ts,x-16,mH-5);const r=cds[idx];if(r){const ib=r.bigSmall==='Big';const info='#'+(r.period||'').slice(-4)+' '+(ib?'🟢':'🔴')+r.result+' '+r.bigSmall;const tw2=c.measureText(info).width+16;const bx=Math.min(x+15,ch-tw2-5);c.fillStyle='rgba(10,10,30,0.95)';c.fillRect(bx,y-30,tw2,24);c.strokeStyle='#00e5ff';c.lineWidth=1;c.strokeRect(bx,y-30,tw2,24);c.fillStyle='#fff';c.font='bold 12px monospace';c.fillText(info,bx+8,y-13);}}}

function setupTB(){

  document.querySelectorAll('#toolbar button[data-ind]').forEach(b=>{b.addEventListener('click',()=>{const k=b.dataset.ind;ind[k]=!ind[k];b.classList.toggle('active',ind[k]);buildCandles();szAll();renderAll();});});
  document.getElementById('btnLoad').addEventListener('click',()=>{if(!isLoading)showLoadMenu();});
  document.getElementById('btnFit').addEventListener('click',()=>{
    userZoomed=false;
    autoFitCandles();
    scrollEnd();
    renderAll();
    D('📐 Auto-fit applied');
  });
  document.getElementById('btnClear').addEventListener('click',()=>{if(confirm('Clear all drawings? (history မပျောက်ပါ)')){draws=[];sel=null;drawSave();renderAll();}});
  document.getElementById('btnReset').addEventListener('click',()=>{
    if(confirm('⚠️ Reset all data?\n\nDelete all history + drawings + cancel any loading?')){

      results=[];
      draws=[];
      lastPeriod='';

      const btn=document.getElementById('btnLoad');

  document.getElementById('cmCol').addEventListener('click',()=>{if(sel){const cs=['#00e5ff','#ffab00','#ff5252','#00e676','#e040fb','#ffeb3b','#ff6d00','#fff'];sel.color=cs[(cs.indexOf(sel.color)+1)%cs.length];drawSave();renderAll();}hideCM();});
  document.getElementById('togH').addEventListener('click',()=>{showH=!showH;szAll();if(!userZoomed)autoFitCandles();renderAll();renderHistory();});

function uCur(){cv.Act.style.cursor=tool==='pointer'?'default':'crosshair';}
function bkPtr(){tool='pointer';document.querySelectorAll('#toolbar button[data-tool]').forEach(b=>b.classList.remove('active'));document.querySelector('[data-tool="pointer"]').classList.add('active');uCur();}

function setupIn(){
  const el=cv.Act;
  el.addEventListener('mousedown',ev=>{ev.preventDefault();hDn(ev.offsetX,ev.offsetY);});
  el.addEventListener('mousemove',ev=>{hMv(ev.offsetX,ev.offsetY);});
  el.addEventListener('mouseup',ev=>{hUp(ev.offsetX,ev.offsetY);});
  el.addEventListener('mouseleave',()=>{mx=-1;my=-1;rCr(-1,-1);pzAct=false;});
  el.addEventListener('dblclick',ev=>{hDb(ev.offsetX,ev.offsetY);});
  el.addEventListener('wheel',ev=>{ev.preventDefault();const r=el.getBoundingClientRect();const wx=ev.clientX-r.left;const wy=ev.clientY-r.top;ev.deltaY<0?zIAt(wx,wy):zOAt(wx,wy);},{passive:false});
  el.addEventListener('contextmenu',ev=>ev.preventDefault());
  let tsx=0,tsy=0,pD2=0,pCx=0,pCy=0,tch=false;
  el.addEventListener('touchstart',ev=>{ev.preventDefault();if(ev.touches.length===2){pD2=Math.hypot(ev.touches[0].clientX-ev.touches[1].clientX,ev.touches[0].clientY-ev.touches[1].clientY);const r=el.getBoundingClientRect();pCx=(ev.touches[0].clientX+ev.touches[1].clientX)/2-r.left;pCy=(ev.touches[0].clientY+ev.touches[1].clientY)/2-r.top;return;}const t=ev.touches[0],r=el.getBoundingClientRect(),tx=t.clientX-r.left,ty=t.clientY-r.top;tch=true;tsx=tx;tsy=ty;lfr=false;ltm=setTimeout(()=>{lfr=true;hDb(tx,ty);},500);hDn(tx,ty);},{passive:false});
  el.addEventListener('touchmove',ev=>{ev.preventDefault();if(ev.touches.length===2){const nd=Math.hypot(ev.touches[0].clientX-ev.touches[1].clientX,ev.touches[0].clientY-ev.touches[1].clientY);if(nd/pD2>1.04){zIAt(pCx,pCy);pD2=nd;}else if(nd/pD2<0.96){zOAt(pCx,pCy);pD2=nd;}return;}clearTimeout(ltm);const t=ev.touches[0],r=el.getBoundingClientRect();hMv(t.clientX-r.left,t.clientY-r.top);},{passive:false});
  el.addEventListener('touchend',ev=>{ev.preventDefault();clearTimeout(ltm);if(tch&&!lfr){const r=el.getBoundingClientRect();let tx=tsx,ty=tsy;if(ev.changedTouches.length){tx=ev.changedTouches[0].clientX-r.left;ty=ev.changedTouches[0].clientY-r.top;}hUp(tx,ty);}tch=false;mx=-1;my=-1;rCr(-1,-1);pzAct=false;},{passive:false});
  document.addEventListener('keydown',ev=>{if((ev.key==='Delete'||ev.key==='Backspace')&&sel){draws=draws.filter(d=>d.id!==sel.id);sel=null;drawSave();renderAll();}if(ev.key==='Escape'){canDr();desel();bkPtr();}});
  document.addEventListener('click',ev=>{if(!ev.target.closest('#cmenu'))hideCM();});
}

function hDn(x,y){mx=x;my=y;hideCM();if(inPA(x)&&y<mH){pzAct=true;pzSY=y;pzSZ=priceZoom;pzMan=true;cv.Act.style.cursor='ns-resize';return;}uCur();if(sel&&tool==='pointer'){const ep=fEP(sel,x,y);if(ep!==null){drg={type:'ep',id:sel.id,idx:ep,sx:x,sy:y};blk=true;return;}if(hT(sel,x,y)){drg={type:'mv',id:sel.id,sx:x,sy:y,ox1:sel.x1,oy1:sel.y1,ox2:sel.x2,oy2:sel.y2};blk=true;return;}sel=null;renderAll();}if(tool!=='pointer'){blk=true;const idx=x2i(x),pr=y2p(y);if(tool==='text'){const t=prompt('Enter text:','Label');if(t){draws.push({id:gid(),type:'text',x1:idx,y1:pr,text:t,color:COL.tx});drawSave();renderAll();}blk=false;bkPtr();return;}if(tool==='hline'){draws.push({id:gid(),type:'hline',y1:pr,color:COL.hl});drawSave();renderAll();blk=false;bkPtr();return;}if(!dip){dip={id:gid(),type:tool,x1:idx,y1:pr,x2:idx,y2:pr,color:tool==='trendline'?COL.tr:tool==='rect'?COL.rl:COL.fb,fill:tool==='rect'?COL.rf:undefined};isDr=true;}return;}pan={sx:x,sy:y,ss:sx};}

function hMv(x,y){mx=x;my=y;if(inPA(x)&&y<mH&&!pzAct&&!drg&&!isDr&&!pan)cv.Act.style.cursor='ns-resize';else if(!pzAct&&!drg)uCur();if(pzAct){priceZoom=Math.max(0.1,Math.min(5,pzSZ+(y-pzSY)*0.005));renderAll();return;}rCr(x,y);if(drg&&drg.type==='ep'){const d=draws.find(dd=>dd.id===drg.id);if(!d)return;const idx=x2i(x),pr=y2p(y);if(d.type==='trendline'||d.type==='fib'){drg.idx===0?(d.x1=idx,d.y1=pr):(d.x2=idx,d.y2=pr);}else if(d.type==='rect'){[()=>{d.x1=idx;d.y1=pr;},()=>{d.x2=idx;d.y2=pr;},()=>{d.x1=idx;d.y2=pr;},()=>{d.x2=idx;d.y1=pr;}][drg.idx]();}else if(d.type==='hline'){d.y1=pr;}sel=d;renderAll();return;}if(drg&&drg.type==='mv'){const d=draws.find(dd=>dd.id===drg.id);if(!d)return;const di=(x-drg.sx)/(cW+cG),dp=-(y-drg.sy)/(mH-40)*pR;if(d.type==='trendline'||d.type==='rect'||d.type==='fib'){d.x1=drg.ox1+di;d.y1=drg.oy1+dp;d.x2=drg.ox2+di;d.y2=drg.oy2+dp;}else if(d.type==='hline'){d.y1=drg.oy1+dp;}else if(d.type==='text'){d.x1=drg.ox1+di;d.y1=drg.oy1+dp;}sel=d;renderAll();return;}if(isDr&&dip){dip.x2=x2i(x);dip.y2=y2p(y);renderAll();return;}if(pan&&tool==='pointer'){sx=pan.ss+(pan.sx-x);renderAll();}}

function hUp(x,y){mx=x;my=y;if(pzAct){pzAct=false;uCur();return;}if(drg){drg=null;blk=false;drawSave();renderAll();return;}if(isDr&&dip){dip.x2=x2i(x);dip.y2=y2p(y);const dx2=Math.abs(i2x(dip.x2)-i2x(dip.x1)),dy2=Math.abs(p2y(dip.y2)-p2y(dip.y1));if(dx2>3||dy2>3){draws.push({...dip});drawSave();}dip=null;isDr=false;blk=false;bkPtr();renderAll();return;}pan=null;}

function hDb(x,y){if(inPA(x)&&y<mH){priceZoom=1;pzMan=false;renderAll();return;}desel();hideCM();for(let i=draws.length-1;i>=0;i--){if(hT(draws[i],x,y)){sel=draws[i];renderAll();showCM(x,y);return;}}desel();renderAll();}

function zIAt(mouseX, mouseY){
  if(cW>=60)return;
  const idxAtMouse=x2i(mouseX);
  const newCW=Math.min(60,cW+2);
  const newCG=Math.max(1,Math.round(newCW*0.3));
  const newSx=idxAtMouse*(newCW+newCG)+newCG-mouseX;
  cW=newCW;cG=newCG;sx=newSx;
  userZoomed=true;
  renderAll();
}

function zOAt(mouseX, mouseY){
  if(cW<=2)return;
  const idxAtMouse=x2i(mouseX);
  const newCW=Math.max(2,cW-2);
  const newCG=Math.max(1,Math.round(newCW*0.3));
  const newSx=idxAtMouse*(newCW+newCG)+newCG-mouseX;
  cW=newCW;cG=newCG;sx=newSx;
  userZoomed=true;
  renderAll();
}

function zI(){zIAt(chW()-100,mH/2);}
function zO(){zOAt(chW()-100,mH/2);}

function hT(d,x,y){switch(d.type){case'trendline':return dSg(x,y,i2x(d.x1)+cW/2,p2y(d.y1),i2x(d.x2)+cW/2,p2y(d.y2))<10;case'hline':return Math.abs(y-p2y(d.y1))<8;case'rect':const x1=i2x(d.x1)+cW/2,y1=p2y(d.y1),x2=i2x(d.x2)+cW/2,y2=p2y(d.y2);return x>=Math.min(x1,x2)-8&&x<=Math.max(x1,x2)+8&&y>=Math.min(y1,y2)-8&&y<=Math.max(y1,y2)+8;case'fib':const hi=Math.max(d.y1,d.y2),lo=Math.min(d.y1,d.y2),rng=hi-lo;for(const lv of FIBLV){if(Math.abs(y-p2y(hi-rng*lv))<8)return true;}return false;case'text':const tx2=i2x(d.x1)+cW/2,ty2=p2y(d.y1);return x>=tx2-5&&x<=tx2+120&&y>=ty2-18&&y<=ty2+6;}return false;}
function fEP(d,px,py){const R=14;if(d.type==='trendline'||d.type==='fib'){if(Math.hypot(px-i2x(d.x1)-cW/2,py-p2y(d.y1))<R)return 0;if(Math.hypot(px-i2x(d.x2)-cW/2,py-p2y(d.y2))<R)return 1;}else if(d.type==='rect'){const x1=i2x(d.x1)+cW/2,y1=p2y(d.y1),x2=i2x(d.x2)+cW/2,y2=p2y(d.y2);if(Math.hypot(px-x1,py-y1)<R)return 0;if(Math.hypot(px-x2,py-y2)<R)return 1;if(Math.hypot(px-x1,py-y2)<R)return 2;if(Math.hypot(px-x2,py-y1)<R)return 3;}else if(d.type==='hline'){if(Math.abs(py-p2y(d.y1))<R)return 0;}return null;}
function dSg(px,py,x1,y1,x2,y2){const A=px-x1,B=py-y1,C2=x2-x1,D=y2-y1,dot=A*C2+B*D,l2=C2*C2+D*D;let t=l2?dot/l2:-1;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(x1+t*C2),py-(y1+t*D));}

function canDr(){dip=null;isDr=false;blk=false;renderAll();}
function desel(){sel=null;renderAll();}
function showCM(x,y){const c=document.getElementById('cmenu');c.style.display='block';c.style.left=Math.min(x,CW()-150)+'px';c.style.top=Math.min(y,H-80)+'px';}
function hideCM(){document.getElementById('cmenu').style.display='none';}
function gid(){return'd_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);}
</script>
